    <td><input type="text" id="pf-${i}" value="${esc(partsOf(r).first)}" data-ch="pName" data-part="first" data-i="${i}" aria-label="First name">${r.dup === 'theirs' ? `<div class="small muted">Also on ${esc(P(other(me)))}’s list. You can combine them later.</div>` : r.dup ? `<div class="small warnTxt">${DUP_TXT[r.dup]}</div>` : ''}</td>
    <td><input type="text" id="pl-${i}" value="${esc(partsOf(r).last)}" data-ch="pName" data-part="last" data-i="${i}" aria-label="Last name"></td>
    <td><select id="pc-${i}" data-ch="pCat" data-i="${i}" aria-label="Category">${CATS.map(([v, l]) => `<option value="${v}" ${r.category === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
    ${showPeople ? `<td><input type="number" id="ph-${i}" min="1" max="20" value="${r.heads}" data-ch="pHeads" data-i="${i}" aria-label="People"></td>` : ''}
    <td><select id="pp-${i}" data-ch="pPlus" data-i="${i}" aria-label="Number of plus-ones">${[0, 1, 2, 3, 4, 5].map(n => `<option value="${n}" ${clampPlus(r.plus) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></td></tr>`).join('');
  const keep = UI.parsed.filter(r => r.keep && r.name.trim()).length;
  return `<div class="card parsed"><div class="tabletop"><h3>Check before adding</h3><span class="small muted">${esc(UI.parseNote)}</span></div>
    <div class="tblwrap" data-scroll="parsed"><table class="tbl compact"><thead><tr><th></th><th>First name</th><th>Last name</th><th>Category</th>${showPeople ? '<th>People</th>' : ''}<th>+1s</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row"><button class="btn primary" data-act="addParsed" ${keep ? '' : 'disabled'}>Add ${keep} to the table</button><button class="btn" data-act="clearParsed">Discard</button></div></div>`;
}

/* ---------- step 4: align ---------- */
function viewAlign(){
  const oth = other(me);
  if (!bothListsIn()) {
    return `<section class="intro"><div><h2>Align the list</h2><p>Do this together, once you have both submitted your rated lists.</p></div><span class="who together">Together</span></section>
    <div class="card empty-state"><h3>Waiting for both lists</h3><ul class="checks"><li class="${listIn('p1') ? 'ok' : ''}">${esc(P('p1'))} ${listIn('p1') ? 'has submitted' : 'has not submitted yet'}</li><li class="${listIn('p2') ? 'ok' : ''}">${esc(S.partners.p2 ? P('p2') : 'Your partner')} ${listIn('p2') ? 'has submitted' : 'has not submitted yet'}</li></ul>
    ${!listIn(me) ? `<button class="btn primary" data-act="tab" data-k="list">Finish my list</button>` : ''}</div>`;
  }
  const p = plan(S);
  const dismissed = shared().dismissed || [];
  const sugg = (UI.dupes || localDupes(S.guests, dismissed)).filter(d => S.guests[d.a] && S.guests[d.b] && !dismissed.includes(d.a + '|' + d.b));
  const dupRows = sugg.map(d => `<div class="duprow"><span class="from p1">${esc(S.guests[d.a].name)}</span><span class="eq" aria-hidden="true">=</span><span class="from p2">${esc(S.guests[d.b].name)}</span><span class="small muted">${esc(d.reason || '')}</span>
    <span class="row"><button class="btn small primary" data-act="merge" data-a="${d.a}" data-b="${d.b}">Same person</button><button class="btn small" data-act="dismiss" data-a="${d.a}" data-b="${d.b}">Different people</button></span></div>`).join('');
  const singles = pid => p.items.filter(x => !x.shared && x.g.owners[0] === pid).sort((a, b) => a.g.name.localeCompare(b.g.name));
  const opt = pid => singles(pid).map(x => `<option value="${x.id}">${esc(x.g.name)}</option>`).join('');

  const sharedItems = p.items.filter(x => x.shared);
  const flags = p.items.map(x => ({x, f: flagOf(x.g)}));
  const apart = flags.filter(o => o.f === 'apart'), later = flags.filter(o => o.f === 'resolved' && resolveOf(o.x.g) === 'later');
  const ORD = {apart: 0, waiting: 1, resolved: 2, aligned: 3, single: 4};
  const shown = flags.filter(o => UI.alignFilter === 'all' ? true : UI.alignFilter === 'both' ? o.x.shared : o.f === 'apart' || o.f === 'resolved' || o.f === 'waiting')
    .sort((a, b) => (ORD[a.f] - ORD[b.f]) || a.x.g.name.localeCompare(b.x.g.name));
  const gapTxt = g => { const gp = gapOf(g); return gp ? [gp.w >= GAP ? 'want ' + gp.w : '', gp.i >= GAP ? 'impact ' + gp.i : ''].filter(Boolean).join(', ') : ''; };
  const fl = (g, f) => f === 'apart' ? `<span class="flag apart">Apart: ${gapTxt(g)}</span>`
      : f === 'resolved' ? (resolveOf(g) === 'later' ? `<span class="flag wait">Grade later</span>` : `<span class="flag avg">Settled: ${RESTXT(resolveOf(g))}</span>`)
      : f === 'aligned' ? `<span class="flag ok">Aligned</span>` : f === 'waiting' ? `<span class="flag wait">Needs both ratings</span>` : `<span class="flag none">One list</span>`;
  const RES = [['avg', 'Agree on the average'], ['p1', 'Use ' + P('p1') + '’s grades'], ['p2', 'Use ' + P('p2') + '’s grades'], ['manual', 'Choose new grades'], ['later', 'Agree later (no grade on the dashboard)']];
  const resolveCtl = g => { const cur = resolveOf(g) || null;
    return `<div class="resolve" role="group" aria-label="How to settle ${esc(g.name)}">${RES.map(([v, l]) => `<button type="button" class="rbtn${cur === v ? ' on' : ''}" aria-pressed="${cur === v}" data-act="resolve" data-id="${g.id}" data-v="${v}">${esc(l)}</button>`).join('')}</div>
      ${cur ? `<button type="button" class="link tiny" data-act="resolve" data-id="${g.id}" data-v="">Undo</button>` : `<span class="small muted">Without a choice, the average is used.</span>`}`; };
  const agreedPanel = g => { if (resolveOf(g) !== 'manual') return '';
    return `<div class="agreed"><div><b>New shared grade</b><p class="small muted">Set it together. It replaces the two grades above for the dashboard.</p></div><div class="agrate">${['w', 'i'].map(k => { const v = g.manual && typeof g.manual[k] === 'number' ? g.manual[k] : 2, id = `mn-${g.id}-${k}`;
      return `<label class="rate"><span class="rl">${k === 'w' ? 'Want' : 'Impact'}</span><input type="range" id="${id}" min="0" max="${RMAX}" step="1" value="${v}" data-ch="manual" data-id="${g.id}" data-k="${k}" data-out="${id}-o" data-unit="n"><output id="${id}-o">${v}</output></label>`; }).join('')}</div></div>`; };
  const rows = shown.map(({x, f}) => { const g = x.g, locked = f === 'apart' || f === 'resolved';
    return `<div class="arow ${f}"><div class="gname"><b>${esc(g.name)}</b><div class="meta">${fromChip(g)}${g.mergedNames ? `<span class="circle">Listed as ${g.mergedNames.map(esc).join(' / ')}</span>` : ''}</div></div>
      ${x.shared ? ['p1', 'p2'].map(pid => `<div class="arate ${pid}"><span class="who-r">${esc(P(pid))}</span>${rateCtl(g, pid, pid === me && !locked)}${locked ? '<span class="lockn">Locked while settling</span>' : ''}</div>`).join('')
        : `<div class="arate ${g.owners[0]} span2"><span class="who-r">${esc(P(g.owners[0]))}</span>${rateCtl(g, g.owners[0], g.owners[0] === me)}</div>`}
      <div class="aflag">${fl(g, f)}${locked ? resolveCtl(g) : ''}</div>${locked ? agreedPanel(g) : ''}</div>`; }).join('');

  const sig = tableSig(S), tc = shared().tableConf || {};
  const okp = pid => tc[pid] === sig;
  return `<section class="intro"><div><h2>Align the list</h2><p>First combine people you both listed. Then talk through the names you rated differently.</p></div><span class="who together">Together</span></section>
  <div class="cols">
  <div class="maincol">
    <div class="card">
      <div class="tabletop"><h3>1. Combine people on both lists</h3>
      <button class="btn small${UI.dupBusy ? '' : ' primary'}" data-act="findDupes" ${UI.dupBusy ? 'disabled' : ''}>${UI.dupBusy ? 'Checking…' : sample ? 'Check with Claude' : 'Look again'}</button></div>
      <p class="small muted">Combining keeps both ratings, so the row shows as coming from both of you. ${sharedItems.length} ${sharedItems.length === 1 ? 'person is' : 'people are'} on both lists.</p>
      ${dupRows || `<p class="small">No likely duplicates found. ${sample ? 'Claude can look for nicknames and typos.' : ''}</p>`}
      <details class="manual"><summary>Combine two names by hand</summary>
        <div class="row wrap"><select id="mA" aria-label="${esc(P('p1'))}'s guest"><option value="">${esc(P('p1'))}’s guest</option>${opt('p1')}</select><span class="eq">=</span>
        <select id="mB" aria-label="${esc(P('p2'))}'s guest"><option value="">${esc(P('p2'))}’s guest</option>${opt('p2')}</select><button class="btn small" data-act="mergeManual">Combine</button></div></details>
    </div>
    <div class="card tablecard">
      <div class="tabletop"><h3>2. Align your ratings</h3>
        <div class="chips">${[['flagged', 'Needs a look'], ['both', 'On both lists'], ['all', 'Everyone']].map(([k, l]) => `<button class="fchip${UI.alignFilter === k ? ' on' : ''}" data-act="alignFilter" data-k="${k}">${l}</button>`).join('')}</div></div>
      <p class="small muted">A name is flagged when your ratings differ by 2 or more on either question. Settle it with one of the options: the average, one of your grades, a new shared grade with its own slider, or agree later. Your own grades are locked meanwhile. To change yours instead, go to Your list.</p>
      <div class="alist">${rows || `<div class="empty-state inline"><h3>${UI.alignFilter === 'flagged' ? 'Nothing to align' : 'No guests'}</h3><p class="muted">${UI.alignFilter === 'flagged' ? 'Every shared name is aligned.' : 'Add guests in Your list.'}</p></div>`}</div>
    </div>
  </div>
  <aside class="side sticky">
    <div class="card"><span class="eyebrow">Alignment</span>
      <div class="qgrid"><div><b>${sharedItems.length}</b><span>on both lists</span></div><div><b class="${apart.length ? 'warnTxt' : ''}">${apart.length}</b><span>still apart</span></div><div><b>${p.items.length}</b><span>guests in total</span></div></div>
      <div class="cfs">${['p1', 'p2'].map(pid => `<span class="cf ${okp(pid) ? 'yes' : ''}">${okp(pid) ? '✓ ' : ''}${esc(P(pid))}</span>`).join('')}</div>
      ${okp(me) ? `<p class="small muted">${okp(oth) ? 'Table submitted by both. Any change to ratings asks you both again.' : 'Waiting for ' + esc(P(oth)) + ' to submit.'}</p>` : `<p class="small muted">${apart.length ? apart.length + ' still apart will use the average if you submit now.' : 'Submit when you are both happy with the table.'}${later.length ? ' ' + later.length + (later.length === 1 ? ' guest is' : ' guests are') + ' graded later and not shown on the dashboard chart yet.' : ''}</p><button class="btn primary full" data-act="submitTable">Submit the table</button>`}
      ${okp('p1') && okp('p2') ? `<button class="btn primary full" data-act="tab" data-k="dash">Open the dashboard</button>` : ''}
    </div>
  </aside></div>`;
}

/* ---------- step 5: dashboard ---------- */
const DEC = {invited: 'Invited', waitlist: 'Waitlist', not: 'Not invited'};
function viewDash(){
  const p = plan(S), c = p.c;
  if (!p.items.length) return `<section class="intro"><div><h2>Dashboard</h2></div><span class="who together">Together</span></section><div class="card empty-state"><h3>No guests yet</h3><p class="muted">Add and rate guests in Your list. The map and suggestions appear here.</p><button class="btn primary" data-act="tab" data-k="list">Go to your list</button></div>`;
  const tc = shared().tableConf || {}, tsig = tableSig(S), tableDone = tc.p1 === tsig && tc.p2 === tsig;
  const mustPct = c.cap ? Math.round(p.mustSeats / c.cap * 100) : 0;
  const fitN = p.promote.all.fits.length, fitSet = new Set(p.promote.all.fits.map(x => x.id));
  const waitNote = p.dec.waitlist.n ? `<div class="waitnote" id="waitnote"><p><b>${p.dec.waitlist.n} ${p.dec.waitlist.n === 1 ? 'guest is' : 'guests are'} on the waitlist.</b> ${fitN
    ? `<b>${fitN}</b> of them still ${fitN === 1 ? 'fits' : 'fit'} in the ${nOf(Math.max(0, p.free.total))} free ${p.free.total === 1 ? 'seat' : 'seats'} and can be moved to Invited. This only happens when you changed a decision by hand. Everyone else on the waitlist is there because their side has no seats left.`
    : `None of them fit in the seats left right now. They move up by themselves when a seat frees up, for example after a decline.`}</p>
    ${fitN ? `<div class="nextup">${p.promote.all.fits.slice(0, 6).map(x => `<button class="nchip ${fromCls(x.g)}" data-act="setDec" data-id="${x.id}" data-v="invited" title="Move ${esc(x.g.name)} to Invited">+ ${esc(x.g.name)}</button>`).join('')}${fitN > 6 ? `<span class="small muted">and ${fitN - 6} more, use the Final column below</span>` : ''}</div>` : ''}</div>` : '';
  const kpis = `<div class="kpis">
    <div class="kpi"><span>Guest cap</span><b>${c.cap}</b><small>set by ${BIND[c.binding]}${c.allLocked ? '' : ' · draft'}</small></div>
    <div class="kpi"><span>Invited</span><b class="${p.total > c.cap ? 'warnTxt' : ''}">${nOf(p.total)}<em>/${c.cap}</em></b><small>${p.dec.invited.n} entries${p.dec.declined.n ? ' · ' + p.dec.declined.n + ' declined' : ''} · ${p.free.total >= 0 ? nOf(p.free.total) + ' seats free' : nOf(-p.free.total) + ' over'}</small></div>
    <div class="kpi"><span>Waitlist</span><b>${p.dec.waitlist.n}</b><small>${seatsTxt(p.dec.waitlist.seats)}${p.dec.waitlist.n ? ` · <b>${fitN}</b> can still move to Invited` : ''}</small></div>
    <div class="kpi"><span>Not invited</span><b>${p.dec.not.n}</b><small>${p.dec.none.n ? p.dec.none.n + ' not rated yet' : 'all rated'}</small></div></div>`;

  const sideBar = pid => { const u = p.used[pid], q = p.quota[pid], fq = p.famQ[pid];
    return `<div class="sidebar ${pid}"><div class="sbh"><b>${esc(sideName(pid))}</b><span class="${u.t > q ? 'warnTxt' : ''}">${nOf(u.t)} / ${q}</span></div>${meter(u.t, q, u.must)}
      <p class="small">Must invite ${nOf(u.must)} (${q ? Math.round(u.must / q * 100) : 0}% of the side) · Family ${nOf(u.fam)}/${fq} · Others ${nOf(u.non)}/${q - fq}</p></div>`; };
  const PROMO = {t1: 'Must invite', t2: 'Impact of 4 or 5, low want', t3: 'Other obligation and joy list'};
  const promoCard = k => { const pr = p.promote[k];
    return `<div class="promo ${k}"><div class="ph"><span class="qdot ${k}"></span><b>${PROMO[k]}</b><span class="small muted">${pr.wait.length} on the waitlist</span></div>
      <p class="pn"><b>${pr.fits.length}</b> ${pr.fits.length === 1 ? 'can move up' : 'can move up'} with the seats left</p>
      ${pr.fits.length ? `<div class="nextup">${pr.fits.slice(0, 4).map(x => `<button class="nchip ${fromCls(x.g)}" data-act="setDec" data-id="${x.id}" data-v="invited" title="Invite ${esc(x.g.name)}">+ ${esc(x.g.name)}</button>`).join('')}${pr.fits.length > 4 ? `<span class="small muted">and ${pr.fits.length - 4} more</span>` : ''}</div>` : ''}</div>`; };
  const seats = `<div class="card seats"><span class="eyebrow">Seats</span>
    <div class="mustline"><b>${mustPct}%</b><span>of the cap is taken by must-invites (${nOf(p.mustSeats)} of ${c.cap} seats)</span></div>
    ${sideBar('p1')}${sideBar('p2')}
    <div class="sidebar both"><div class="sbh"><b>On both lists</b><span>${nOf(p.used.pool)} seats</span></div><p class="small muted">Taken off the top before the sides split the rest.</p></div>
    <div class="promos">${promoCard('t1')}${promoCard('t2')}${promoCard('t3')}</div></div>`;

  // table
  const f = UI.dash;
  const items = p.items.filter(x => (f.q === 'all' || x.q === f.q) && (f.side === 'all' || fromCls(x.g) === f.side) && (f.dec === 'all' || (x.declined ? 'declined' : (x.final || 'none')) === f.dec)).sort(p.byScore);
  const qcell = x => x.later ? `<span class="qchip unrated">Grade later</span>` : quadChip(x.q);
  const rowOf = x => { const g = x.g, cb = x.c;
    return `<tr class="${UI.selected === x.id ? 'sel' : ''}" id="row-${x.id}"><td><button class="namebtn" data-act="select" data-id="${x.id}">${esc(g.name)}</button></td>
      <td>${fromChip(g)}</td><td class="num" data-l="Seats">${x.planned}</td><td class="num" data-l="Want">${cb ? nOf(cb.w) : '–'}</td><td class="num" data-l="Impact">${cb ? nOf(cb.i) : '–'}</td><td>${qcell(x)}</td>
      <td data-l="Suggested">${x.sugg ? `<span class="dchip ${x.sugg}">${DEC[x.sugg]}</span>` : '–'}</td>
      <td data-l="Final">${x.declined ? `<span class="dchip declined">Declined</span><div><button class="link tiny" data-act="tab" data-k="track">Change in the RSVP tracker</button></div>` : `<select id="dec-${x.id}" class="decsel ${x.final || ''}" data-ch="dec" data-id="${x.id}" aria-label="Final decision for ${esc(g.name)}">${x.final ? '' : '<option value="">Choose</option>'}${Object.entries(DEC).map(([v, l]) => `<option value="${v}" ${x.final === v ? 'selected' : ''}>${l}</option>`).join('')}</select>${x.overridden ? `<button class="link tiny" data-act="resetDec" data-id="${x.id}">Use suggestion</button>` : ''}${x.final === 'waitlist' && fitSet.has(x.id) ? `<div><span class="fitchip" title="There are enough free seats to invite this guest">Fits, can move up</span></div>` : ''}`}</td></tr>`; };
  const spotTxt = o => o.left >= 0 ? `<b>${nOf(o.left)}</b> of ${o.quota} left` : `<b>${nOf(-o.left)}</b> beyond its share of ${o.quota}`;
  const groupTable = (k, title, sub) => { const list = items.filter(x => !!x.fam === (k === 'fam')), gp = p.groups[k];
    return `<div class="grouphead ${k}"><div><h4>${title}</h4><span class="small muted">${sub}</span></div>
      <div class="spots" aria-label="Spots left for ${title.toLowerCase()}">${['p1', 'p2'].map(pid => `<span class="spot ${pid}"><i class="kd ${pid}"></i>${esc(P(pid))}: ${spotTxt(gp[pid])}</span>`).join('')}</div></div>
      <div class="tblwrap" data-scroll="dash-${k}"><table class="tbl stack d"><thead><tr><th>Guest</th><th>From</th><th class="num">Seats</th><th class="num">Want</th><th class="num">Impact</th><th>Quadrant</th><th>Suggested</th><th>Final</th></tr></thead><tbody>${list.map(rowOf).join('') || `<tr><td colspan="8" class="muted">No guests match these filters.</td></tr>`}</tbody></table></div>`; };
  const overrides = p.items.filter(x => x.g.decision).length;
  const sig = finalSig(p), fc = shared().finalConf || {}, okp = pid => fc[pid] === sig;
  const sel = UI.selected && p.items.find(x => x.id === UI.selected);
  return `<section class="intro"><div><h2>Dashboard</h2><p>Suggestions follow your ratings and seat bounds. Change any final decision; the counts update as you go.</p></div><span class="who together">Together</span></section>
  ${tableDone ? '' : `<div class="banner soft"><span>The table hasn’t been submitted by both of you yet, so this is a draft.</span><button class="btn small" data-act="tab" data-k="align">Align the list</button></div>`}
  ${kpis}
  ${waitNote}
  <div class="dashgrid">
    <div class="card chartcard"><div class="tabletop"><h3>Want vs impact</h3><label class="tick"><input type="checkbox" id="showNames" ${UI.showNames ? 'checked' : ''} data-ch="showNames">Show names</label></div>
      ${chart(p)}
      <div class="keys"><span><i class="kd p1"></i>${esc(P('p1'))}</span><span><i class="kd p2"></i>${esc(P('p2'))}</span><span><i class="kd both"></i>Both</span><span><i class="kd ring"></i>Waitlist (dotted outline)</span><span><i class="kd faint"></i>Not invited (faded)</span><span><i class="kd gone"></i>Declined (transparent)</span></div>
      ${sel ? selCard(sel) : `<p class="small muted">Tap a dot to see the guest and change the decision.</p>`}
    </div>
    ${seats}
  </div>
  <div class="card tablecard">
    <div class="tabletop"><h3>Final suggestion</h3>
      <div class="filters">
        <select id="fq" data-ch="dashF" data-f="q" aria-label="Quadrant"><option value="all">All quadrants</option>${Object.keys(QUADS).map(k => `<option value="${k}" ${f.q === k ? 'selected' : ''}>${QUADS[k].label} (${p.quad[k].n})</option>`).join('')}</select>
        <select id="fs" data-ch="dashF" data-f="side" aria-label="From"><option value="all">Both sides</option><option value="p1" ${f.side === 'p1' ? 'selected' : ''}>${esc(P('p1'))}</option><option value="p2" ${f.side === 'p2' ? 'selected' : ''}>${esc(P('p2'))}</option><option value="both" ${f.side === 'both' ? 'selected' : ''}>On both lists</option></select>
        <select id="fd" data-ch="dashF" data-f="dec" aria-label="Decision"><option value="all">Any decision</option>${Object.entries(Object.assign({}, DEC, {declined: 'Declined'})).map(([v, l]) => `<option value="${v}" ${f.dec === v ? 'selected' : ''}>${l} (${p.dec[v].n})</option>`).join('')}</select>
      </div></div>
    ${groupTable('fam', 'Family', 'Guests of type Family')}
    ${groupTable('non', 'Friends, colleagues and others', 'Everyone who is not family')}
    <p class="small muted">The spots are each side’s share for that group, which is filled first. If a share is full but the side still has seats, the next guest in line still gets one, so nobody waits while their side has room. Guests on both lists use the shared pool and do not count here.</p>
    <div class="tablefoot">
      <span class="small muted">${overrides ? overrides + ' changed by hand' : 'All decisions follow the suggestion'}</span>
      ${overrides ? `<button class="btn small" data-act="resetAllDec">Use all suggestions</button>` : ''}
      <span class="grow1"></span>
      <div class="cfs">${['p1', 'p2'].map(pid => `<span class="cf ${okp(pid) ? 'yes' : ''}">${okp(pid) ? '✓ ' : ''}${esc(P(pid))}</span>`).join('')}</div>
      ${okp(me) ? `<span class="small muted">${okp(other(me)) ? 'Approved by both' : 'You approved this list'}</span>` : `<button class="btn small primary" data-act="approve">Approve this list</button>`}
    </div>
  </div>`;
}
function selCard(x){ const g = x.g;
  return `<div class="selcard ${fromCls(g)}"><div><b>${esc(g.name)}</b><div class="small muted">${esc(fromLabel(g))} · ${catLabel(g.category)} · ${seatsTxt(x.planned)}${x.c ? ` · want ${nOf(x.c.w)}, impact ${nOf(x.c.i)}` : ''}</div></div>
    ${x.declined ? `<div class="small"><span class="dchip declined">Declined</span> <button class="link tiny" data-act="tab" data-k="track">Change in the RSVP tracker</button></div>` : `<div class="seg">${Object.entries(DEC).map(([v, l]) => `<button class="${x.final === v ? 'on' : ''}" data-act="setDec" data-id="${x.id}" data-v="${v}">${l}</button>`).join('')}</div>`}</div>`; }
function hashN(s){ let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }
function chart(p){
  // plot area 52..412 x, 34..394 y; quadrant labels sit outside the plot so dots never hide them
  const L = 52, R = 412, T = 34, B = 394, W = R - L, H = B - T;
  const X = w => L + (w + 0.5) / 6 * W, Y = i => B - (i + 0.5) / 6 * H, mid = X(2.5), midY = Y(2.5);
  const quads = [['obligation', L, T, mid - L, midY - T], ['must', mid, T, R - mid, midY - T], ['skip', L, midY, mid - L, B - midY], ['joy', mid, midY, R - mid, B - midY]];
  const qlab = {obligation: [L, T - 10, 'start'], must: [R, T - 10, 'end'], skip: [L, B + 44, 'start'], joy: [R, B + 44, 'end']};
  let out = `<svg class="chart" viewBox="0 0 424 446" role="img" aria-label="Guests mapped by want and impact">`;
  quads.forEach(([k, x, y, w, h]) => { out += `<rect class="qbg ${k}" x="${x}" y="${y}" width="${w}" height="${h}"/>`; });
  quads.forEach(([k]) => { const [lx, ly, an] = qlab[k]; out += `<text class="qlab ${k}" x="${lx}" y="${ly}" text-anchor="${an}">${QUADS[k].label} · ${p.quad[k].n}</text>`; });
  out += `<line class="axis" x1="${L}" y1="${B}" x2="${R}" y2="${B}"/><line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${B}"/>`;
  [0, 1, 2, 3, 4, 5].forEach(v => { out += `<text class="tk" x="${X(v)}" y="${B + 14}" text-anchor="middle">${v}</text><text class="tk" x="${L - 8}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`; });
  out += `<text class="axlab" x="${(L + R) / 2}" y="${B + 30}" text-anchor="middle">Want them there →</text><text class="axlab" x="16" y="${(T + B) / 2}" text-anchor="middle" transform="rotate(-90 16 ${(T + B) / 2})">Impact if not invited →</text>`;
  // dots with the same rating share a cell: fan them out in a spiral so none sit exactly on top of another
  const cells = {}; p.items.filter(x => x.c).forEach(x => { (cells[x.c.w + '|' + x.c.i] = cells[x.c.w + '|' + x.c.i] || []).push(x); });
  const pts = []; Object.values(cells).forEach(list => { list.sort((a, b) => hashN(a.id) - hashN(b.id)); const n = list.length, step = n <= 1 ? 0 : Math.min(9.5, 27 / Math.sqrt(n));
    list.forEach((x, k) => { const ang = k * 2.39996, r = step * Math.sqrt(k); pts.push({x, cx: X(x.c.w) + Math.cos(ang) * r, cy: Y(x.c.i) + Math.sin(ang) * r}); }); });
  // greedy label placement: try right, left, above, below; skip a label that would collide
  const boxes = pts.map(o => [o.cx - 6, o.cy - 6, o.cx + 6, o.cy + 6]);
  const hit = (b) => b[0] < L + 1 || b[2] > R - 1 || b[1] < T + 1 || b[3] > B - 1 || boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
  const labels = {};
  if (UI.showNames) {
    const order = pts.slice().sort((a, b) => (UI.selected === b.x.id) - (UI.selected === a.x.id) || b.x.score - a.x.score);
    order.forEach(o => {
      const nm = o.x.g.name.length > 18 ? o.x.g.name.slice(0, 17) + '…' : o.x.g.name, w = nm.length * 4.9 + 2, h = 10;
      const tries = [[o.cx + 8, o.cy - h / 2, 'start'], [o.cx - 8 - w, o.cy - h / 2, 'end'], [o.cx - w / 2, o.cy - 8 - h, 'middle'], [o.cx - w / 2, o.cy + 8, 'middle']];
      for (const [x0, y0, an] of tries) { const b = [x0, y0, x0 + w, y0 + h]; if (!hit(b) || UI.selected === o.x.id) { boxes.push(b); labels[o.x.id] = {x: an === 'start' ? x0 : an === 'end' ? x0 + w : x0 + w / 2, y: y0 + h - 2, an, nm}; break; } }
    });
  }
  pts.forEach(({x, cx, cy}) => {
    const cls = `pt ${fromCls(x.g)} ${x.declined ? 'declined' : (x.final || 'none')}${UI.selected === x.id ? ' sel' : ''}`;
    out += `<g class="${cls}" data-act="select" data-id="${x.id}" tabindex="0" role="button" aria-label="${esc(x.g.name)}"><title>${esc(x.g.name)}${x.final === 'waitlist' ? ' (waitlist)' : x.declined ? ' (declined)' : ''}</title>${x.final === 'waitlist' ? `<circle class="wring" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${UI.selected === x.id ? 11.5 : 9.5}"/>` : ''}<circle class="core" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${UI.selected === x.id ? 7 : 5}"/>`;
    const lb = labels[x.id]; if (lb) out += `<text class="plab" x="${lb.x.toFixed(1)}" y="${lb.y.toFixed(1)}" text-anchor="${lb.an}">${esc(lb.nm)}</text>`;
    out += `</g>`;
  });
  const hidden = UI.showNames ? pts.length - Object.keys(labels).length : 0;
  return out + `</svg>${hidden ? `<p class="small muted">${hidden} ${hidden === 1 ? 'name is' : 'names are'} hidden where dots overlap. Tap a dot to see it.</p>` : ''}`;
}

  bRows.push(['Question', P('p1') + ' (' + (ROLE('p1') || 'partner 1') + ')', P('p2') + ' (' + (ROLE('p2') || 'partner 2') + ')', 'Agreed value', 'Status']);
  QUESTIONS.forEach(q => {
    if (q.k === 'feelMax') { bRows.push([plainQ(q), ansTxt(q, 'p1'), ansTxt(q, 'p2'), '', 'Sets the lowest number you can agree on']); return; }
    const agreed = q.pair ? P('p1') + ' ' + c.family.p1 + '% · ' + P('p2') + ' ' + c.family.p2 + '% (together ' + fs.pct + '% family)' : fmtNum(c[q.k], q.unit);
    bRows.push([plainQ(q), ansTxt(q, 'p1'), ansTxt(q, 'p2'), agreed, c.status[q.k] === 'locked' ? 'Locked' : 'Draft']);
  });
  bRows.push(['How many guests should come in total', '', '', c.finalN, c.status.finalN === 'locked' ? 'Locked' : 'Draft'], ['Range to choose from', '', '', c.lo + ' to ' + c.hi]);
  addSheet(wb, 'Bounds', bRows, {titles: [1, bHead - 1], heads: [2, bHead], freeze: 0});

  // 3. Individual answers, one sheet per partner
  ['p1', 'p2'].forEach(pid => {
    const rows = [['Bounds answers'], ['Question', 'Answer']];
    QUESTIONS.forEach(q => rows.push([qName(q), ansTxt(q, pid)]));
    rows.push(['Submitted', yn(ansIn(pid))], [], ['Ratings of ' + P(pid) + '’s own guests (0 to 5)'],
      ['First name', 'Last name', 'Type', '+1s', 'Want (when submitted)', 'Impact (when submitted)', 'Want (now)', 'Impact (now)', 'Also on ' + P(other(pid)) + '’s list']);
    const mine = p.items.filter(x => x.g.owners.includes(pid)).sort((a, b) => a.g.name.localeCompare(b.g.name));
    const head2 = rows.length;
    mine.forEach(x => rows.push([partsOf(x.g).first, partsOf(x.g).last, catLabel(x.g.category), plusOf(x.g), ini(pid, x.id, 'w'), ini(pid, x.id, 'i'), rat(x.g, pid, 'w'), rat(x.g, pid, 'i'), yn(x.shared)]));
    addSheet(wb, 'Answers ' + P(pid), rows, {titles: [1, QUESTIONS.length + 5], heads: [2, head2]});
  });

  // 4. Alignment output
  const al = p.items.filter(x => x.shared).sort((a, b) => a.g.name.localeCompare(b.g.name));
  const aRows = [['Guest', 'Listed as', P('p1') + ' want (when submitted)', P('p1') + ' impact (when submitted)', P('p2') + ' want (when submitted)', P('p2') + ' impact (when submitted)', 'Gap want', 'Gap impact',
    P('p1') + ' want (aligned)', P('p1') + ' impact (aligned)', P('p2') + ' want (aligned)', P('p2') + ' impact (aligned)', 'Result', 'Combined want', 'Combined impact', 'Quadrant']];
  al.forEach(x => { const g = x.g, gp = gapOf(g), f = flagOf(g);
    aRows.push([g.name, g.mergedNames ? g.mergedNames.join(' / ') : '', ini('p1', x.id, 'w'), ini('p1', x.id, 'i'), ini('p2', x.id, 'w'), ini('p2', x.id, 'i'),
      ini('p1', x.id, 'w') !== '' && ini('p2', x.id, 'w') !== '' ? Math.abs(ini('p1', x.id, 'w') - ini('p2', x.id, 'w')) : '', ini('p1', x.id, 'i') !== '' && ini('p2', x.id, 'i') !== '' ? Math.abs(ini('p1', x.id, 'i') - ini('p2', x.id, 'i')) : '',
      rat(g, 'p1', 'w'), rat(g, 'p1', 'i'), rat(g, 'p2', 'w'), rat(g, 'p2', 'i'), flagTxt(g), x.c ? r1(x.c.w) : '', x.c ? r1(x.c.i) : '', x.later ? 'Grade later' : QUADS[x.q].label]); });
  if (!al.length) aRows.push(['No guests are on both lists yet.']);
  aRows.push([], ['A name is flagged when the two ratings differ by ' + GAP + ' or more on either question. “When submitted” is each partner’s rating when they submitted their list; “aligned” is the rating after the alignment step.']);
  addSheet(wb, 'Alignment', aRows, {heads: [1], freeze: 1});

  // 5. Guests (everything about every guest)
  const head = ['First name', 'Last name', 'From', 'Type', 'People', '+1s allowed', P('p1') + ' want', P('p1') + ' impact', P('p2') + ' want', P('p2') + ' impact', 'Combined want', 'Combined impact', 'Quadrant', 'Alignment', 'Suggested', 'Final', 'Changed by hand', 'Reply', '+1s coming', 'Expected seats', 'Note'];
  const gRows = [head].concat(p.items.slice().sort(p.byScore).map(x => { const g = x.g, pc = plusInOf(g);
    return [partsOf(g).first, partsOf(g).last, fromLabel(g), catLabel(g.category), headsOf(g), plusOf(g), rat(g, 'p1', 'w'), rat(g, 'p1', 'i'), rat(g, 'p2', 'w'), rat(g, 'p2', 'i'), x.c ? r1(x.c.w) : '', x.c ? r1(x.c.i) : '',
      (x.later ? 'Grade later' : QUADS[x.q].label), flagTxt(g), x.sugg ? DEC[x.sugg] : '', x.declined ? 'Declined' : x.final ? DEC[x.final] : '', x.overridden ? 'Yes' : '', x.final === 'invited' ? REPLY[g.rsvp || 'pending'] : '',
      x.final === 'invited' && plusOf(g) ? (pc == null ? 'Unknown' : pc) : '', x.final === 'invited' ? expectedSeats(g) : 0, g.note || '']; }));
  addSheet(wb, 'Guests', gRows, {heads: [1], freeze: 1});

  // 6. Final list
  const order = {invited: 0, waitlist: 1, not: 2};
  const fRows = [['Decision', 'Guest', 'From', 'Type', 'Seats planned', 'Want', 'Impact', 'Quadrant']].concat(p.items.slice().sort((a, b) => ((order[a.final] == null ? 3 : order[a.final]) - (order[b.final] == null ? 3 : order[b.final])) || p.byScore(a, b))
    .map(x => [x.declined ? 'Declined' : x.final ? DEC[x.final] : 'No decision', x.g.name, fromLabel(x.g), catLabel(x.g.category), x.planned, x.c ? r1(x.c.w) : '', x.c ? r1(x.c.i) : '', x.later ? 'Grade later' : QUADS[x.q].label]));
  addSheet(wb, 'Final list', fRows, {heads: [1], freeze: 1});

  // 7. RSVP tracker
  const cm = inv.filter(x => (x.g.rsvp || 'pending') === 'accepted'), wt = inv.filter(x => (x.g.rsvp || 'pending') === 'pending'), dc = inv.filter(x => x.g.rsvp === 'declined');
  const tRows = [['RSVP tracker'], ['Expected seats', p.total, 'of a cap of ' + c.cap], ['Coming', cm.reduce((a, x) => a + expectedSeats(x.g), 0), cm.length + (cm.length === 1 ? ' reply' : ' replies')], ['Waiting to hear', wt.length], ['Declined', dc.length, dc.reduce((a, x) => a + x.planned, 0) + ' seats freed'], [],
    ['Guest', 'From', 'Reply', '+1s allowed', '+1s coming', 'Expected seats', 'Note']];
  inv.slice().sort((a, b) => a.g.name.localeCompare(b.g.name)).forEach(x => { const g = x.g, pc = plusInOf(g); tRows.push([g.name, fromLabel(g), REPLY[g.rsvp || 'pending'], plusOf(g), plusOf(g) ? (pc == null ? 'Unknown' : pc) : '', expectedSeats(g), g.note || '']); });
  if (!inv.length) tRows.push(['No one is invited yet.']);
  addSheet(wb, 'RSVP tracker', tRows, {titles: [1], heads: [7], freeze: 7});

  // 8. Waitlist
  const fits = p.promote.all.fits;
  const wRows = [['Guest', 'From', 'Type', 'Quadrant', 'Want', 'Impact', 'Seats', 'Fits in the free seats now']].concat(p.promote.all.wait.map(x => [x.g.name, fromLabel(x.g), catLabel(x.g.category), QUADS[x.q].label, x.c ? r1(x.c.w) : '', x.c ? r1(x.c.i) : '', x.planned, yn(fits.includes(x))]));
  if (!p.promote.all.wait.length) wRows.push(['The waitlist is empty.']);
  addSheet(wb, 'Waitlist', wRows, {heads: [1], freeze: 1});
  return wb;
}

}

function submittedV(pid, k){ const a = S.answers[pid]; return a && a.values ? a.values[k] : undefined; }
// Reads a sheet that has a header row (the template, or any table with name columns) without Claude.
const toType = t => { t = String(t || '').trim().toLowerCase(); return /fam|cousin|aunt|uncle|grand|tante|oncle|onkel/.test(t) ? 'family' : /colleague|work|office|coll[eè]gue|kolleg/.test(t) ? 'colleague' : /other|autre|andere/.test(t) ? 'other' : 'friend'; };
function parseTemplate(wb){
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header: 1, defval: '', blankrows: false});
    const find = (H, re) => H.findIndex(h => re.test(h));
    let hi = -1, H = [];
    for (let i = 0; i < Math.min(rows.length, 10); i++) {
      const h = rows[i].map(c => String(c).trim().toLowerCase());
      if (find(h, /^(first|given|pr[eé]nom|vorname)/) >= 0 || (find(h, /^(name|guest|nom|invit|gast)/) >= 0 && h.filter(Boolean).length >= 1 && rows.length > i + 1)) { hi = i; H = h; break; }
    }
    if (hi < 0) continue;
    const iF = find(H, /^(first|given|pr[eé]nom|vorname)/), iL = find(H, /^(family|last|sur|nom de famille|nachname)/);
    const iN = iF >= 0 ? -1 : find(H, /^(name|guest|nom|invit|gast)/);
    const iP = find(H, /\+\s*1|plus/), iT = find(H, /(guest\s*)?type|categor|relation/), iG = find(H, /group|circle|groupe|gruppe/);
    const out = [];
    rows.slice(hi + 1).forEach(r => {
      const name = (iF >= 0 ? [r[iF], iL >= 0 ? r[iL] : ''] : [r[iN]]).map(x => String(x == null ? '' : x).trim()).filter(Boolean).join(' ').replace(/\s+/g, ' ');
      if (!name) return;
      const pv = iP >= 0 ? String(r[iP]).trim() : '';
      out.push({name: name.slice(0, 80), first: iF >= 0 ? String(r[iF] == null ? '' : r[iF]).trim().replace(/\s+/g, ' ') : undefined, last: iF >= 0 && iL >= 0 ? String(r[iL] == null ? '' : r[iL]).trim().replace(/\s+/g, ' ') : undefined, category: toType(iT >= 0 ? r[iT] : iG >= 0 ? r[iG] : ''), heads: 1, plus: clampPlus(/^(yes|oui|ja|x|\+1)$/i.test(pv) ? 1 : parseInt(pv, 10)), keep: true});
    });
    return out;
  }
  return null;
}
