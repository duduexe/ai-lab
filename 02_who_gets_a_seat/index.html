<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Who Gets a Seat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
/* Layout: one calm column of steps; cards on a lilac-white ground; side colors (deep pink / light pink / lavender) carry who-is-who everywhere */
:root{
  --bg:#FAF7FC; --surface:#FFFFFF; --surface-2:#F5F0F9; --ink:#2E2939; --ink-2:#6F6781; --line:#EAE3F0;
  --accent:#6A58A8; --accent-ink:#FFFFFF; --accent-soft:#EEE8FA;
  --p1:#F2BDD6; --p1-strong:#B02468; --p1-ink:#9A1F5A; --p2:#FBE1EE; --p2-strong:#E888B5; --p2-ink:#B23E80; --both:#E7DFF7; --both-strong:#8670CC;
  --mint:#D8F1E3; --mint-strong:#2F8A5C; --butter:#FBF0C9; --butter-strong:#9C7A12; --peach:#FBE2D4; --peach-strong:#B9623C;
  --stone:#EFEBF3; --stone-strong:#857D92; --rose:#FADADF; --rose-strong:#B83A50;
  --display:'Instrument Serif', 'Cormorant Garamond', Georgia, serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:16px; --r-s:10px; --shadow:0 1px 2px rgba(60,40,90,.05), 0 6px 24px rgba(60,40,90,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17151C; --surface:#211E28; --surface-2:#2A2633; --ink:#EEEAF5; --ink-2:#A79FB5; --line:#36313F;
  --accent:#B9A9F0; --accent-ink:#1B1724; --accent-soft:#332C48;
  --p1:#5E2A49; --p1-strong:#D8508F; --p1-ink:#F08CBD; --p2:#473041; --p2-strong:#F7B8D6; --p2-ink:#F6B6D4; --both:#352D4E; --both-strong:#B9A6EE;
  --mint:#1F3A2C; --mint-strong:#7FD3A5; --butter:#3B3320; --butter-strong:#E6C86C; --peach:#43302A; --peach-strong:#EFA787;
  --stone:#2E2A35; --stone-strong:#A79FB5; --rose:#45252C; --rose-strong:#F28C9C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#17151C; --surface:#211E28; --surface-2:#2A2633; --ink:#EEEAF5; --ink-2:#A79FB5; --line:#36313F;
  --accent:#B9A9F0; --accent-ink:#1B1724; --accent-soft:#332C48;
  --p1:#5E2A49; --p1-strong:#D8508F; --p1-ink:#F08CBD; --p2:#473041; --p2-strong:#F7B8D6; --p2-ink:#F6B6D4; --both:#352D4E; --both-strong:#B9A6EE;
  --mint:#1F3A2C; --mint-strong:#7FD3A5; --butter:#3B3320; --butter-strong:#E6C86C; --peach:#43302A; --peach-strong:#EFA787;
  --stone:#2E2A35; --stone-strong:#A79FB5; --rose:#45252C; --rose-strong:#F28C9C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25); color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0 48px}
#app{max-width:1120px; margin:0 auto}
h1,h2,h3{margin:0; text-wrap:balance}
h2{font-family:var(--display); font-weight:400; font-size:clamp(30px, 4vw, 40px); line-height:1.05; letter-spacing:-.01em}
h3{font-size:15px; font-weight:650}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.small{font-size:13px} .muted{color:var(--ink-2)} .warnTxt{color:var(--rose-strong)!important} .ok{color:var(--mint-strong); font-weight:600}
.eyebrow{display:block; font-size:11px; font-weight:650; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2); margin-bottom:6px}
.num{font-variant-numeric:tabular-nums; text-align:right}

/* header */
.top{display:flex; flex-wrap:wrap; gap:14px 20px; align-items:center; justify-content:space-between; padding-block:22px 14px}
.brand{display:flex; align-items:center; gap:12px}
.brand h1{font-family:var(--display); font-weight:400; font-size:28px; line-height:1}
.brand p{font-size:12.5px; color:var(--ink-2); margin-top:3px}
.ring-mark{position:relative; width:38px; height:26px; flex:none}
.ring-mark::before,.ring-mark::after{content:""; position:absolute; top:1px; width:24px; height:24px; border-radius:50%; border:3px solid var(--p1-strong)}
.ring-mark::before{left:0} .ring-mark::after{left:12px; border-color:var(--p2-strong); mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ring-mark::after{mix-blend-mode:screen} }
:root[data-theme="dark"] .ring-mark::after{mix-blend-mode:screen}
.people{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.pchip{display:inline-flex; align-items:center; gap:7px; padding:6px 12px 6px 9px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-weight:600; font-size:14px}
.pchip small{font-weight:500; color:var(--ink-2); font-size:12px}
.pchip .dot{width:10px; height:10px; border-radius:50%}
.pchip.p1 .dot{background:var(--p1-strong)} .pchip.p2 .dot{background:var(--p2-strong)}
.pchip.me{box-shadow:inset 0 0 0 1.5px var(--accent)}
.pchip.empty{color:var(--ink-2); font-weight:500; border-style:dashed}
.link{background:none; border:0; padding:4px 2px; color:var(--accent); font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px}
.link.tiny{font-size:12px; display:block}

/* banners */
.banner{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; padding:10px 14px; border-radius:var(--r-s); margin-bottom:12px; font-size:14px}
.banner.danger{background:var(--rose); color:var(--ink); align-items:flex-start} .banner.danger .row{flex-wrap:wrap}
.banner.demo{background:var(--both); color:var(--ink)} .banner.warn{background:var(--butter)} .banner.soft{background:var(--surface-2)}

/* steps */
.steps{display:flex; gap:6px; overflow-x:auto; padding:6px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-bottom:22px; scrollbar-width:thin}
.step{flex:1 0 auto; display:flex; align-items:center; gap:9px; padding:9px 12px; border:0; border-radius:12px; background:none; cursor:pointer; text-align:left; min-width:148px}
.step:hover{background:var(--surface-2)}
.step.on{background:var(--accent-soft)}
.sn{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; background:var(--surface-2); color:var(--ink-2); flex:none}
.step.on .sn{background:var(--accent); color:var(--accent-ink)}
.st{display:flex; flex-direction:column; line-height:1.2}
.stt{font-weight:650; font-size:14px}
.who{font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase}
.who.solo{color:var(--p2-ink)} .who.together{color:var(--p1-ink)} .who.guide{color:var(--ink-2)} .who.either{color:var(--both-strong)}
.step.guide .sn{font-family:var(--display); font-style:italic; font-size:15px}
.step.guide{min-width:132px}
.sd{margin-left:auto; font-size:11px; font-weight:700; color:var(--ink-2); background:var(--surface-2); padding:2px 7px; border-radius:999px; white-space:nowrap}
.sd.done{background:var(--mint); color:var(--mint-strong)}
.intro .who{padding:5px 11px; border-radius:999px; background:var(--surface); border:1px solid var(--line); align-self:flex-start}

/* layout */
.intro{display:flex; gap:16px; justify-content:space-between; align-items:flex-end; margin-bottom:18px}
.intro p{color:var(--ink-2); margin-top:8px; max-width:62ch}
.cols{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:18px; align-items:start}
.maincol,.qlist{display:grid; gap:14px; min-width:0}
.side{display:grid; gap:14px; min-width:0}
.sticky{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 12px)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--shadow); min-width:0; display:grid; gap:12px; align-content:start}
.row{display:flex; gap:8px; align-items:center} .row.wrap{flex-wrap:wrap}
.grow1{flex:1}
.empty-state{text-align:left; padding:28px} .empty-state.inline{box-shadow:none; border:1px dashed var(--line); border-radius:var(--r-s); padding:22px}
.checks{list-style:none; padding:0; margin:0; display:grid; gap:6px}
.checks li::before{content:"\25CB"; margin-right:8px; color:var(--ink-2)} .checks li.ok::before{content:"\2713"; color:var(--mint-strong)}
@media (max-width:860px){ .cols{grid-template-columns:minmax(0,1fr)} .sticky{position:static} }

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 15px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger-ghost{background:transparent; border-color:var(--line); color:var(--rose-strong)} .btn.danger-ghost:hover{background:var(--rose)}
.btn.danger{background:var(--rose); border-color:var(--rose); color:var(--rose-strong)}
.btn.small{padding:6px 12px; font-size:13px}
.btn.full{width:100%}
.btn.big{flex-direction:column; align-items:flex-start; padding:14px 18px; border-radius:var(--r-s); font-size:16px; text-align:left}
.btn.big small{font-weight:500; color:var(--ink-2); font-size:12.5px}
.btn.big.p1{background:var(--p1); border-color:transparent} .btn.big.p2{background:var(--p2); border-color:transparent}
.btn:disabled{opacity:.45; cursor:not-allowed}
.seg{display:inline-flex; flex-wrap:wrap; gap:4px; background:var(--surface-2); padding:4px; border-radius:12px}
.seg button{border:0; background:none; padding:7px 12px; border-radius:9px; font-weight:600; font-size:13.5px; cursor:pointer; color:var(--ink-2)}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(40,20,70,.12)}
.seg button:disabled{cursor:default}
.seg.wide{display:flex} .seg.wide button{flex:1 1 180px; text-align:center}
.seg.three button{flex:1 1 0; min-width:0}
.seg.mini button{padding:5px 9px; font-size:12.5px}
.seg.mini button.on.accepted{background:var(--mint); color:var(--mint-strong)}
.seg.mini button.on.declined{background:var(--rose); color:var(--rose-strong)}

/* inputs */
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-s); padding:8px 10px; min-width:0}
textarea{width:100%; resize:vertical}
input[type=range]{accent-color:var(--accent); width:100%; min-width:0; height:22px; cursor:pointer}
input[type=range]:disabled{cursor:default; opacity:.75}
input[type=checkbox]{accent-color:var(--accent); width:16px; height:16px}
.tick{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer}

/* who */
.who-card{max-width:520px; margin:24px auto; background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:28px; box-shadow:var(--shadow); display:grid; gap:16px}
.who-card .lead{color:var(--ink-2)}
.who-card .cont{display:grid; gap:10px}
.join{display:grid; gap:10px}
.join label,.join .lbl{font-weight:600; font-size:13.5px}
.join .seg{display:flex} .join .seg button{flex:1}
.join .hint{font-size:12.5px; color:var(--ink-2)}
.slotnote{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2)}
.slotnote .dot{width:12px; height:12px; border-radius:50%; flex:none}
.slotnote .dot.p1{background:var(--p1-strong)} .slotnote .dot.p2{background:var(--p2-strong)}

/* question cards */
.qcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:18px; align-items:center; box-shadow:var(--shadow)}
.qtxt{display:grid; gap:6px; min-width:0}
.qtxt p{color:var(--ink-2); font-size:13.5px}
.slide{display:grid; gap:2px; min-width:0}
.slide output.big{font-family:var(--display); font-size:30px; line-height:1; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.slide output.big.long{font-size:22px; line-height:1.2}
.ends{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-2)}
@media (max-width:640px){ .qcard{grid-template-columns:minmax(0,1fr)} }
.qcard.agree{align-items:start}
.qcard.is-locked{background:linear-gradient(0deg, var(--surface), var(--surface)) padding-box; border-color:var(--mint)}
.pair{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:4px}
.pv{display:inline-flex; flex-direction:column; padding:6px 12px; border-radius:var(--r-s); font-weight:650; font-variant-numeric:tabular-nums; font-size:14px}
.pv small{font-weight:600; font-size:11px; color:var(--ink-2)}
.pv.p1{background:var(--p1)} .pv.p2{background:var(--p2)}
.tag{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px}
.tag.close{background:var(--mint); color:var(--mint-strong)} .tag.discuss{background:var(--peach); color:var(--peach-strong)}
.agreebox{display:grid; gap:12px; min-width:0}
.confrow{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between}
.cfs{display:flex; flex-wrap:wrap; gap:6px}
.cf{font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-2)}
.cf.yes{background:var(--mint); color:var(--mint-strong)}
.locked{display:flex; align-items:center; gap:8px; font-size:15px; padding:10px 12px; background:var(--mint); border-radius:var(--r-s); color:var(--ink)}
.locked b{font-family:var(--display); font-weight:400; font-size:22px}
.lockico{width:12px; height:10px; border-radius:2px; background:var(--mint-strong); position:relative; margin-top:4px}
.lockico::before{content:""; position:absolute; left:2px; top:-6px; width:8px; height:8px; border:2px solid var(--mint-strong); border-bottom:0; border-radius:5px 5px 0 0; box-sizing:border-box}

/* cap card */
.capnum{font-family:var(--display); font-size:54px; line-height:1; display:flex; align-items:baseline; gap:8px; font-variant-numeric:tabular-nums}
.capnum small{font-family:var(--body); font-size:13px; color:var(--ink-2)}
.capbars{display:grid; gap:8px}
.cb{display:grid; grid-template-columns:110px minmax(0,1fr) 44px; gap:8px; align-items:center; font-size:12.5px; color:var(--ink-2)}
.cb b{text-align:right; font-variant-numeric:tabular-nums; color:var(--ink)}
.cb .track{height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.cb .track i{display:block; height:100%; background:var(--stone-strong); opacity:.5; border-radius:99px}
.cb.bind{color:var(--ink); font-weight:650} .cb.bind .track i{background:var(--accent); opacity:1}

/* quota + meter */
.qgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.qgrid div{display:grid; gap:2px}
.qgrid b{font-family:var(--display); font-weight:400; font-size:30px; line-height:1; font-variant-numeric:tabular-nums}
.qgrid span{font-size:12px; color:var(--ink-2); line-height:1.25}
.meter{position:relative; display:flex; height:12px; background:var(--surface-2); border-radius:99px; overflow:visible}
.meter i{display:block; height:100%}
.meter .m-must{background:var(--mint-strong); border-radius:99px 0 0 99px; opacity:.75}
.meter .m-rest{background:var(--mint-strong); opacity:.32}
.meter .m-cap{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); border-radius:2px; transform:translateX(-1px)}

/* upload */
.drop{display:flex; gap:14px; align-items:center; padding:18px; border:1.5px dashed var(--both-strong); border-radius:var(--r); background:var(--both); cursor:pointer}
.drop:hover{filter:brightness(.98)}
.drop input{position:absolute; width:1px; height:1px; opacity:0}
.drop:focus-within{outline:2px solid var(--accent); outline-offset:2px}
.dropico{width:34px; height:40px; border-radius:6px; background:var(--surface); border:2px solid var(--both-strong); position:relative; flex:none}
.dropico::after{content:""; position:absolute; left:7px; right:7px; top:9px; height:14px; border-top:2px solid var(--both-strong); border-bottom:2px solid var(--both-strong)}
.parsing{display:flex; gap:10px; align-items:center; font-size:14px; padding:10px 12px; background:var(--surface-2); border-radius:var(--r-s)}
.spin{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.addone{display:flex; gap:8px; flex-wrap:wrap} .addone input{flex:1 1 140px; min-width:0}
.nameEdit{display:flex; gap:6px; min-width:0} .nameEdit .nameIn{flex:1 1 0; min-width:0; margin-left:0}

/* filter chips + table tops */
.tabletop{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.fchip{border:1px solid var(--line); background:var(--surface); padding:5px 11px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-2)}
.fchip span{font-weight:700; color:var(--ink-2); margin-left:2px; font-variant-numeric:tabular-nums}
.fchip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)} .fchip.on span{color:var(--bg)}
.sortsel{font-size:13px; color:var(--ink-2); display:flex; gap:6px; align-items:center}
.legend{display:flex; flex-wrap:wrap; gap:4px 18px; font-size:12px; color:var(--ink-2); padding:8px 12px; background:var(--surface-2); border-radius:var(--r-s)}
.filters{display:flex; flex-wrap:wrap; gap:6px}
.filters select{font-size:13px; padding:6px 8px}

/* guest rows (list) */
.glist,.alist{display:grid}
.grow{display:grid; grid-template-columns:minmax(150px,1.3fr) auto minmax(220px,1.6fr) 120px; gap:12px; align-items:center; padding:12px 4px; border-top:1px solid var(--line)}
.grow:first-child{border-top:0}
.grow.theirs{opacity:.92}
.gname{display:grid; gap:4px; min-width:0}
.gname b{font-weight:650; overflow-wrap:anywhere}
.nameIn{font-weight:650; border-color:transparent; background:transparent; padding:4px 6px; margin-left:-6px; width:100%}
.nameIn:hover,.nameIn:focus{border-color:var(--line); background:var(--surface)}
.meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.from{display:inline-block; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap}
.from.p1{background:var(--p1)} .from.p2{background:var(--p2)} .from.both{background:var(--both)}
.circle{font-size:12px; color:var(--ink-2)}
.gattrs{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.gattrs select{font-size:13px; padding:5px 6px}
.num input{width:52px; padding:5px 6px; margin-left:2px}
label.num{display:inline-flex; align-items:center; font-size:13px; color:var(--ink-2)}
.grates{display:grid; gap:4px; min-width:0}
.rate{display:grid; grid-template-columns:52px minmax(0,1fr) 24px; gap:8px; align-items:center; font-size:12px}
.rate .rl{color:var(--ink-2); font-weight:600}
.rate output{font-weight:700; text-align:right; font-variant-numeric:tabular-nums}
.rate.unset input{opacity:.35} .rate.unset output{color:var(--ink-2)}
.hidden-note{font-style:italic}
.gq{display:flex; gap:6px; align-items:center; justify-content:flex-end}
.x{border:0; background:none; font-size:20px; line-height:1; color:var(--ink-2); cursor:pointer; padding:2px 6px; border-radius:6px}
.x:hover{background:var(--rose); color:var(--rose-strong)}
@media (min-width:761px){ .nameEdit{flex-direction:column; gap:2px} .nameEdit .nameIn{flex:none; width:100%} }
@media (max-width:760px){ .nameEdit{flex-direction:column; gap:2px} .nameEdit .nameIn{flex:none; width:100%} .gname{max-width:230px} }

<div id="app"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
/* ===== Pure logic: constraints, ratings, seat plan ===== */
// Hard bounds: facts one of you enters and the other checks (either of you can change them, then both confirm again).
// snap: the slider starts at 1 and then moves in steps of `step` (1, 5, 10 ... or 1, 500, 1000 ...)
const HARDQ = [
  {k:'fbPP', type:'range', label:'What is the average food and drinks budget per guest?', help:'The full catering cost for one guest, drinks included.', min:1, max:400, step:5, snap:true, unit:'money'},
  {k:'fbTotal', type:'range', label:'What is your total food and drinks budget?', help:'The most you want to spend on catering for the whole wedding.', min:1, max:100000, step:500, snap:true, unit:'money'},
  {k:'venueMax', type:'range', label:'How many guests can the venue hold at most?', help:'Use the venue’s capacity. If you have not chosen a venue yet, leave it high.', min:10, max:300, step:5, unit:'guests'}
];
// Personal bounds: each of you answers alone, then you align them together.
const QUESTIONS = [
  {k:'feelMax', type:'range', label:'Above how many guests does it stop feeling like our wedding?', help:'Your gut number, whatever the budget says.', min:10, max:300, step:5, unit:'guests', suggest:'min', rule:'lower of the two'},
  {k:'split', type:'range', label:'How should the seats be split between your two sides?', help:'This splits the seats left once the guests you both invited are placed. In the middle, each side gets the same number.', min:20, max:80, step:5, unit:'split', suggest:'mid', rule:'midpoint', gapAbs:10},
  {k:'family', type:'range', pair:true, label:'What share of your side’s seats should be kept for family?', help:'The rest goes to friends, colleagues and other guests. You answer for your own side, and your partner answers for theirs. Together you will see what both answers add up to.', min:0, max:100, step:5, unit:'fam', suggest:'pair', rule:'each side keeps its own answer'}
];
const FINALQ = {k:'finalN', min:1, max:300, step:1, unit:'guests', rule:'midpoint of the two feel answers'};
const LOCKABLE = ['hard', 'finalN', 'split', 'family'];   // what the two of you confirm together
const DEFAULTS = {fbPP:150, fbTotal:15000, venueMax:120, feelMax:80, split:50, family:50};
const RMAX = 5;                 // ratings go from 0 to 5
const RATE_HIGH = 2.5, GAP = 2, IMPACT_TOP = 4;   // 3 or more counts as high; ratings differing by 2 or more are flagged
const QUADS = {
  must:{label:'Must invite', short:'Must', desc:'High want, high impact'},
  joy:{label:'Joy list', short:'Joy', desc:'High want, low impact'},
  obligation:{label:'Obligation', short:'Obligation', desc:'Low want, high impact'},
  skip:{label:'Skip', short:'Skip', desc:'Low want, low impact'},
  unrated:{label:'Not rated', short:'Not rated', desc:'Waiting for a rating'}
};

function isLocked(l){ return !!(l && l.conf && (l.conf.p1 || l.conf.p2)); }   // personal bounds lock as soon as one of you confirms (you may be at one screen)
function submittedVal(st, pid, k){ const a = st.answers && st.answers[pid]; return a && a.submitted && a.values ? a.values[k] : undefined; }
function suggestValue(q, a, b){
  if (a == null && b == null) return null;
  if (a == null) return b;
  if (b == null) return a;
  if (q.type === 'choice') return a === b ? a : null;
  if (q.pair) return {p1: a, p2: b};
  if (q.suggest === 'min') return Math.min(a, b);
  return Math.round(((a + b) / 2) / q.step) * q.step;
}
function gapTag(q, a, b){
  if (a == null || b == null || q.pair) return null;
  if (q.type === 'choice') return a === b ? 'close' : 'discuss';
  const d = Math.abs(a - b);
  if (q.gapAbs) return d > q.gapAbs ? 'discuss' : 'close';
  return d / Math.max(Math.abs(a), Math.abs(b), 1) > 0.15 ? 'discuss' : 'close';
}
const isNum = v => typeof v === 'number' && isFinite(v);
// The hard bounds as saved. Until someone saves them, an older answer sheet (from before hard bounds existed) or the defaults fill in.
function hardOf(st){
  const h = st.hard || {}, hv = h.values || {}, vals = {};
  HARDQ.forEach(q => {
    let v = hv[q.k];
    if (!isNum(v)) { const old = pid => { const a = st.answers && st.answers[pid]; return a && a.values ? a.values[q.k] : undefined; }; v = isNum(old('p1')) ? old('p1') : isNum(old('p2')) ? old('p2') : DEFAULTS[q.k]; }
    vals[q.k] = v;
  });
  const c = h.conf || {};
  return {values: vals, conf: {p1: !!c.p1, p2: !!c.p2}, by: h.by || null, entered: !!h.values, locked: !!(c.p1 && c.p2)};
}
function hardLimits(v){
  const fb = Math.max(0, Math.floor(v.fbTotal / Math.max(1, v.fbPP)));
  const hi = Math.min(fb, v.venueMax);
  return {fb, venue: v.venueMax, hi, hiBind: hi === fb ? 'budget' : 'venue'};
}
// The numbers the two of you can agree on: from the lowest "feel" answer up to the hard maximum.
function capRange(hv, f1, f2){
  const L = hardLimits(hv), fs = [f1, f2].filter(isNum), lo = fs.length ? Math.min(L.hi, Math.min(...fs)) : L.hi;
  return Object.assign({lo, hi: L.hi, feel: {p1: isNum(f1) ? f1 : null, p2: isNum(f2) ? f2 : null}, loBind: lo < L.hi ? 'feel' : L.hiBind}, {fb: L.fb, venue: L.venue, hiBind: L.hiBind});
}
function pickN(r, n){ const x = n == null || isNaN(n) ? r.lo : n; return Math.min(r.hi, Math.max(r.lo, Math.round(x))); }
function constraintsOf(st){
  const out = {}, status = {};
  let locked = 0;
  const H = hardOf(st);
  Object.assign(out, H.values); status.hard = H.locked ? 'locked' : 'draft'; if (H.locked) locked++;
  out.hardConf = H.conf; out.hardBy = H.by; out.hardEntered = H.entered;
  const f1 = submittedVal(st, 'p1', 'feelMax'), f2 = submittedVal(st, 'p2', 'feelMax');
  QUESTIONS.forEach(q => {
    if (q.k === 'feelMax') return;
    const l = st.locks && st.locks[q.k];
    if (q.pair) {
      // a side that is missing (never answered, or saved half-way) starts at the default, so there is never an empty value
      const a = submittedVal(st, 'p1', 'family'), b = submittedVal(st, 'p2', 'family');
      const lv = (l && l.value) || {}, fam = {p1: isNum(lv.p1) ? lv.p1 : isNum(a) ? a : DEFAULTS.family, p2: isNum(lv.p2) ? lv.p2 : isNum(b) ? b : DEFAULTS.family};
      out.family = fam;
      if (isLocked(l) && l.value) { status.family = 'locked'; locked++; } else status.family = 'draft';
      return;
    }
    if (isLocked(l)) { out[q.k] = l.value; status[q.k] = 'locked'; locked++; return; }
    const a = submittedVal(st, 'p1', q.k), b = submittedVal(st, 'p2', q.k);
    let v = l && l.value != null ? l.value : suggestValue(q, a, b);

  });

  out.feel = rng.feel; out.feelMax = isNum(f1) && isNum(f2) ? Math.min(f1, f2) : isNum(f1) ? f1 : isNum(f2) ? f2 : DEFAULTS.feelMax;
  if (isLocked(lN)) { out.finalN = pickN(rng, lN.value); status.finalN = 'locked'; locked++; }
  else if (rng.lo === rng.hi && H.locked && isNum(f1) && isNum(f2)) { out.finalN = rng.lo; status.finalN = 'locked'; locked++; out.finalAuto = true; }
  else {
    let v = lN && lN.value != null ? lN.value : (isNum(f1) && isNum(f2) ? (f1 + f2) / 2 : isNum(f1) ? f1 : isNum(f2) ? f2 : rng.lo);
    out.finalN = pickN(rng, v); status.finalN = 'draft';
  }
  out.fbCap = rng.fb; out.lo = rng.lo; out.hi = rng.hi; out.hiBind = rng.hiBind; out.loBind = rng.loBind;
  out.cap = out.finalN;
  out.binding = out.cap >= rng.hi ? rng.hiBind : out.cap <= rng.lo && rng.loBind === 'feel' ? 'feel' : 'pick';
  out.low = rng.loBind;
  out.status = status; out.locked = locked; out.total = LOCKABLE.length; out.allLocked = locked === LOCKABLE.length;
  return out;
}

function rated(r){ return !!r && typeof r.w === 'number' && typeof r.i === 'number'; }
const resolveOf = g => g.resolve || (g.keepAvg ? 'avg' : null);
// How two partners' grades for a guest on both lists become one grade.
function combined(g){
  const owners = g.owners || [], a = g.r && g.r.p1, b = g.r && g.r.p2;
  if (owners.length > 1 && rated(a) && rated(b) && (Math.abs(a.w - b.w) >= GAP || Math.abs(a.i - b.i) >= GAP)) {
    const rv = resolveOf(g);
    if (rv === 'later') return null;
    if (rv === 'p1') return {w: a.w, i: a.i};
    if (rv === 'p2') return {w: b.w, i: b.i};
    if (rv === 'manual' && rated(g.manual)) return {w: g.manual.w, i: g.manual.i};
  }
  const rs = owners.map(o => g.r && g.r[o]).filter(rated);
  if (!rs.length) return null;
  return {w: rs.reduce((s, r) => s + r.w, 0) / rs.length, i: rs.reduce((s, r) => s + r.i, 0) / rs.length};
}
function quadrantOf(c){
  if (!c) return 'unrated';
  const hw = c.w >= RATE_HIGH, hi = c.i >= RATE_HIGH;
  return hw && hi ? 'must' : hw ? 'joy' : hi ? 'obligation' : 'skip';
}
// Who gets a seat first (high = 2.5 or more):
// 1 = must invite (high impact and high want), 2 = impact of 4 or 5 with low want: they take the seats left once every must invite has one,
// 3 = the rest of the obligation (impact under 4) and joy list guests: invited while their side has seats, in order of total rating, else waitlist,
// 4 = low impact and low want (not invited)
function tierOf(c){
  if (!c) return null;
  const hw = c.w >= RATE_HIGH, hi = c.i >= RATE_HIGH;
  if (hi && hw) return 1;
  if (c.i >= IMPACT_TOP - 1e-9) return 2;
  if (hw || hi) return 3;
  return 4;
}
function scoreOf(c, t){ return !c ? -1 : t === 1 ? 5000 + c.i * 10 + c.w : t === 2 ? 4000 + c.i * 10 + c.w : t === 3 ? 3000 + (c.w + c.i) * 10 + c.i : c.w + c.i; }
function gapOf(g){
  if ((g.owners || []).length < 2) return null;
  const a = g.r && g.r.p1, b = g.r && g.r.p2;
  if (!rated(a) || !rated(b)) return null;
  return {w: Math.abs(a.w - b.w), i: Math.abs(a.i - b.i)};
}
function flagOf(g){
  if ((g.owners || []).length < 2) return 'single';
  const gp = gapOf(g);
  if (!gp) return 'waiting';
  if (gp.w < GAP && gp.i < GAP) return 'aligned';
  return resolveOf(g) ? 'resolved' : 'apart';
}
const plusOf = g => Math.max(0, Math.min(5, Math.round(typeof g.plus === 'number' ? g.plus : g.plusOne ? 1 : 0)));
function plusInOf(g){   // how many plus-ones are coming; null while unknown
  if (typeof g.plusIn === 'number') return Math.max(0, Math.min(plusOf(g), g.plusIn));
  if (g.plusOneComing === false) return 0;
  if (g.plusOneComing === true) return plusOf(g);
  return null;
}
const headsOf = g => Math.max(1, Math.round(+g.heads || 1));
function plannedSeats(g){ return headsOf(g) + plusOf(g); }
function expectedSeats(g){
  if (g.rsvp === 'declined') return 0;
  const pc = plusInOf(g);
  return headsOf(g) + (pc == null ? plusOf(g) : pc);
}

function plan(st){
  const c = constraintsOf(st);
  const items = Object.entries(st.guests || {}).filter(([, g]) => g && g.name).map(([id, g]) => {
    const cb = combined(g), q = quadrantOf(cb), tier = tierOf(cb);
    return {id, g: Object.assign({}, g, {id}), c: cb, q, tier, shared: (g.owners || []).length > 1, fam: g.category === 'family',
      score: scoreOf(cb, tier), planned: plannedSeats(g), exp: expectedSeats(g), later: !cb && resolveOf(g) === 'later'};
  });
  const sugg = {};
  const byScore = (a, b) => (b.score - a.score) || String(a.g.name).localeCompare(String(b.g.name));
  // tier 4 is never invited; tiers 1, 2 and 3 are invited in that order while there is space, then wait
  const fixed = x => x.tier === 4 ? 'not' : null;
  const EPS = 1e-9;

  // guests on both lists come out of one shared pool, taken off the top
  const sharedItems = items.filter(x => x.shared);
  sharedItems.forEach(x => { sugg[x.id] = fixed(x); });
  let usedPool = 0;
  const reserveFor = t => items.filter(x => !x.shared && x.tier < t).reduce((s, x) => s + x.exp, 0);   // seats the single-list guests of better tiers will need
  [1, 2, 3].forEach(t => sharedItems.filter(x => x.tier === t).sort(byScore).forEach(x => {
    if (usedPool + reserveFor(t) + x.exp <= c.cap + EPS) { sugg[x.id] = 'invited'; usedPool += x.exp; } else sugg[x.id] = 'waitlist'; }));

  const finalOf = x => x.g.decision || sugg[x.id] || null;
  const seatUse = x => finalOf(x) === 'invited' ? expectedSeats(x.g) : 0;
  const poolSeats = sharedItems.reduce((s, x) => s + seatUse(x), 0);
  const indiv = Math.max(0, c.cap - poolSeats);
  const quota = {p1: Math.round(indiv * c.split / 100)}; quota.p2 = indiv - quota.p1;
  const famQ = {p1: Math.round(quota.p1 * c.family.p1 / 100), p2: Math.round(quota.p2 * c.family.p2 / 100)};
  const contrib = x => x.shared ? [] : [[x.g.owners[0], 1]];
  const isPoolItem = x => x.shared;

  const u = {p1: {t: 0, fam: 0, non: 0}, p2: {t: 0, fam: 0, non: 0}};
  const add = (x, amt) => contrib(x).forEach(([s, f]) => { u[s].t += amt * f; u[s][x.fam ? 'fam' : 'non'] += amt * f; });
  const pass2 = items.filter(x => !x.shared);
  pass2.forEach(x => { sugg[x.id] = fixed(x); });
  // The family and others shares are filled first. A guest who does not fit in their own share still gets a seat while the
  // side has seats left (so nobody waits while there is room), and tier 1 is fully settled before tier 2 starts.
  [1, 2, 3].forEach(t => {
    const list = pass2.filter(x => x.tier === t).sort(byScore);
    list.forEach(x => {
      const ok = contrib(x).every(([s, f]) => {
        const a = x.exp * f, lim = x.fam ? famQ[s] : quota[s] - famQ[s];
        return u[s].t + a <= quota[s] + EPS && u[s][x.fam ? 'fam' : 'non'] + a <= lim + EPS;
      });
      if (ok) { sugg[x.id] = 'invited'; add(x, x.exp); } else sugg[x.id] = 'waitlist';
    });
    list.filter(x => sugg[x.id] === 'waitlist').forEach(x => {
      if (contrib(x).every(([s, f]) => u[s].t + x.exp * f <= quota[s] + EPS)) { sugg[x.id] = 'invited'; add(x, x.exp); }
    });
  });

  const used = {p1: {t: 0, fam: 0, non: 0, must: 0}, p2: {t: 0, fam: 0, non: 0, must: 0}, pool: 0, poolMust: 0};
  const dec = {invited: {n: 0, seats: 0}, waitlist: {n: 0, seats: 0}, not: {n: 0, seats: 0}, none: {n: 0, seats: 0}, declined: {n: 0, seats: 0}};
  items.forEach(x => {
    x.sugg = sugg[x.id] || null;
    x.final = finalOf(x);
    x.overridden = !!x.g.decision && x.g.decision !== x.sugg;
    x.seats = x.final === 'invited' ? expectedSeats(x.g) : x.planned;
    x.declined = x.final === 'invited' && x.g.rsvp === 'declined';   // said no in the RSVP tracker: takes no seat
    const d = dec[x.declined ? 'declined' : (x.final || 'none')]; d.n++; d.seats += x.seats;
    if (x.final !== 'invited' || !x.seats) return;
    if (isPoolItem(x)) { used.pool += x.seats; if (x.q === 'must') used.poolMust += x.seats; }
    else contrib(x).forEach(([s, f]) => { used[s].t += x.seats * f; used[s][x.fam ? 'fam' : 'non'] += x.seats * f; if (x.q === 'must') used[s].must += x.seats * f; });

  const free = {p1: quota.p1 - used.p1.t, p2: quota.p2 - used.p2.t, total: c.cap - total};
  const mustSeats = used.p1.must + used.p2.must + used.poolMust;
  // spots per side and group (family or others), for the dashboard tables
  const groups = {};
  ['fam', 'non'].forEach(k => {
    groups[k] = {};
    ['p1', 'p2'].forEach(pid => { const q = k === 'fam' ? famQ[pid] : quota[pid] - famQ[pid]; groups[k][pid] = {quota: q, used: used[pid][k], left: q - used[pid][k]}; });
  });

  function fitList(list){
    const f = {...free}, out = [];
    list.slice().sort(byScore).forEach(x => {
      const s = x.planned;
      if (s > f.total + EPS) return;
      if (isPoolItem(x)) { out.push(x); f.total -= s; return; }

  [1, 2, 3].forEach(t => { const w = wait.filter(x => x.tier === t); promote['t' + t] = {wait: w.slice().sort(byScore), fits: fitList(w)}; });
  promote.all = {wait: wait.slice().sort(byScore), fits: fitList(wait)};

  const quad = {};

  items.forEach(x => { const o = quad[x.q]; o.n++; o.seats += x.planned; o[x.shared ? 'both' : x.g.owners[0]]++; });

}

function hashStr(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function finalSig(p){ return hashStr(p.items.filter(x => x.final === 'invited').map(x => x.id).sort().join(',')); }
function tableSig(st){
  return hashStr(Object.keys(st.guests || {}).sort().map(id => { const g = st.guests[id]; if (!g) return id; const r = g.r || {};
    return [id, (g.owners || []).join('+'), r.p1 ? r.p1.w + '/' + r.p1.i : '', r.p2 ? r.p2.w + '/' + r.p2.i : '', resolveOf(g) || '', g.manual ? g.manual.w + '/' + g.manual.i : ''].join(':'); }).join('|'));

function normName(s){ return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function localDupes(guests, dismissed){
  const a = [], b = [], out = [];
  Object.entries(guests || {}).forEach(([id, g]) => { if (!g || (g.owners || []).length !== 1) return; (g.owners[0] === 'p1' ? a : b).push({id, g}); });
  a.forEach(x => b.forEach(y => {
    const key = x.id + '|' + y.id; if ((dismissed || []).includes(key)) return;
    const na = normName(x.g.name), nb = normName(y.g.name); if (!na || !nb) return;
    let reason = null;

  const peopleHtml = S.partners.p1 || S.partners.p2 ? people : `<span class="pchip empty">No one has joined yet</span>`;
  const banner = mode === 'demo' ? `<div class="banner demo"><span><b>Example couple.</b> Nothing you do here is saved.</span><button class="btn small" data-act="exitDemo">Back to your list</button></div>`
    : mode === 'memory' ? `<div class="banner warn"><span>Saving isn’t available in this view. Changes stay on this screen until you close it.</span></div>`
    : connLost ? `<div class="banner warn"><span>This page lost its connection, so changes are no longer saved. Reload the page to continue.</span></div>`
    : readOnly ? `<div class="banner warn"><span>You can view this page but not change it. Ask the owner to share it with you as an Editor.</span></div>` : '';
  const nUns = Object.keys(unsaved).length;
  const unsavedBanner = nUns && mode === 'db' ? `<div class="banner danger" role="alert"><span><b>${nUns === 1 ? '1 change is' : nUns + ' changes are'} not saved yet.</b> Your partner cannot see ${nUns === 1 ? 'it' : 'them'} until it is saved. They are still on this screen, so do not close the page. Error: ${esc((lastFail && lastFail.code) || 'unknown')}.</span>
    <span class="row"><button class="btn small primary" data-act="resave">Try saving again</button><button class="btn small" data-act="checkSave">Find out why</button></span></div>` : '';
  const nav = STEPS.map((s, i) => {
    if (s.k === 'guide') return `<button class="step guide${tab === s.k ? ' on' : ''}" data-act="tab" data-k="guide" ${tab === s.k ? 'aria-current="page"' : ''}><span class="sn">i</span><span class="st"><span class="stt">Start here</span><span class="who guide">How it works</span></span></button>`;
    const st = stepState(s.k);
    return `<button class="step${tab === s.k ? ' on' : ''}" data-act="tab" data-k="${s.k}" ${tab === s.k ? 'aria-current="page"' : ''}>
      <span class="sn">${i}</span><span class="st"><span class="stt">${s.t}</span><span class="who ${s.who}">${WHO_TXT[s.who]}</span></span>
      ${st === 'done' ? '<span class="sd done" title="Done">✓</span>' : st && st !== 'todo' ? `<span class="sd">${esc(st)}</span>` : ''}</button>`;
  }).join('');
  const views = {guide: viewGuide, hard: viewHard, bounds: viewBounds, agree: viewAgree, list: viewList, align: viewAlign, dash: viewDash, track: viewTrack};
  return `
  <header class="top">
    <div class="brand"><div class="ring-mark" aria-hidden="true"></div><div><h1>Who Gets a Seat</h1><p>Guest list alignment for two</p></div></div>
    <div class="people">${peopleHtml}${me ? `<button class="link" data-act="switch">Switch person</button>` : ''}<button class="btn small xl" data-act="excel" title="Everything entered so far, in one Excel file">Download Excel</button>${mode !== 'demo' && mode !== 'loading' && !readOnly ? `<button class="btn small danger-ghost" data-act="askReset" title="Delete every answer, guest and upload for both of you">Reset data</button>` : ''}</div>
  </header>
  ${banner}${unsavedBanner}
  ${UI.confirmReset && mode !== 'demo' ? `<div class="banner danger" role="alertdialog" aria-label="Reset all data"><span><b>Reset all data?</b> This deletes both of your names, every answer, every guest list and uploaded Excel, all ratings and the RSVP replies. It cannot be undone, and it also clears the page for your partner. Download the Excel first if you want a copy.</span>
    <span class="row"><button class="btn small" data-act="excel">Download Excel first</button><button class="btn small danger" data-act="resetAll">Yes, delete everything</button><button class="btn small" data-act="cancelReset">Keep my data</button></span></div>` : ''}
  <nav class="steps" aria-label="Steps" data-scroll="nav">${nav}</nav>
  <main>${tab === 'guide' ? viewGuide() : me ? (views[tab] || viewBounds)() : viewWho()}${tab === 'guide' || me ? nextBar(tab) : ''}</main>
  <footer class="foot">
    ${mode === 'demo' ? '' : `<button class="link" data-act="demo">Explore the example couple</button>`}
    ${mode === 'db' ? `<button class="link" data-act="checkSave"${UI.checking ? ' disabled' : ''}>${UI.checking ? 'Checking…' : 'Check that saving works'}</button>` : ''}
  </footer>
  ${UI.check ? `<section class="card checkbox" aria-label="Saving check"><h3>Saving check</h3><ul class="checks">${UI.check.map(r => `<li class="${r.ok ? 'ok' : ''}">${esc(r.t)}</li>`).join('')}</ul><p class="small muted">If a line has no tick, send a screenshot of this box to whoever set up the page.</p><button class="link" data-act="closeCheck">Close</button></section>` : ''}`;
}

/* ---------- start here ---------- */
const GUIDE = [
  {k: 'hard', who: 'either', t: 'Set the hard bounds', do: 'Pick your currency, then set the facts: food and drinks per guest, the total food and drinks budget and what the venue can hold. Either of you can enter them. The other one sees that they are filled in, can change them and then confirms.', get: 'A hard maximum for the number of guests: the lower of what the budget and the venue allow.'},
  {k: 'bounds', who: 'solo', t: 'Answer your personal bounds', do: 'Answer three questions with sliders: the number of guests above which it stops feeling like your wedding, how to split the seats between your two sides, and the family share of your own side.', get: 'Your own answers. Your partner can’t see them yet.'},
  {k: 'agree', who: 'together', t: 'Align your bounds', do: 'You see the hard bounds again, and can go back to change them. Then agree on the final number of guests, next to both “stops feeling like our wedding” answers. The number can go from the lower of those answers up to the hard maximum. Then agree on the split of seats, and on the family share of each side.', get: 'Locked numbers: the total number of guests, the seats per side, and the family share of each side.'},
  {k: 'list', who: 'solo', t: 'Build and rate your list', do: 'Download the Excel template, fill it in and upload it, or upload any list (Word, CSV, text) and Claude fills the table. You can also type names in, with a first name and a last name. Rate each of your own guests from 0 to 5 on two questions, now or later: names are saved without a rating, and unrated guests show as “Not rated”. Trim if you are over your side’s seats.', get: 'Your rated list in the shared table. Ratings stay hidden until you have both submitted.'},
  {k: 'align', who: 'together', t: 'Align the list', do: 'Combine people you both listed, so they show as coming from both of you. Then go through each shared name where your ratings differ by 2 or more. For each one you can agree on the average, use one of your grades, choose new grades by hand, or agree later.', get: 'One agreed table, submitted by both of you.'},
  {k: 'dash', who: 'together', t: 'Decide on the dashboard', do: 'See every guest on the 2x2, and the seats left for each of you, split into family and others. Must invites (high impact and high want) get a seat first. Then guests with an impact of 4 or 5 take the seats left, then everyone else in the obligation and joy list areas, while their side has seats. Whoever does not fit goes on the waitlist. Change any suggestion by hand, then both approve.', get: 'The final list: invited, waitlist and not invited.'},
  {k: 'track', who: 'together', t: 'Track replies', do: 'Log who is coming, who declined and whether plus-ones come. When a guest declines or a plus-one is not coming, the next guest in line on the waitlist moves up to Invited by itself.', get: 'A live headcount that keeps the dashboard up to date.'}
];
function viewGuide(){
  const nextStep = me ? (GUIDE.find(s => stepState(s.k) !== 'done') || GUIDE[GUIDE.length - 1]) : null;
  const steps = GUIDE.map((s, i) => {
    const st = me ? stepState(s.k) : '';
    return `<li class="gstep ${s.who}">
      <div class="gnum"><span>${i + 1}</span></div>
      <div class="gbody">
        <div class="ghead"><h3>${s.t}</h3><span class="who ${s.who}">${WHO_TXT[s.who]}</span>${st === 'done' ? '<span class="sd done">✓ Done</span>' : st && st !== 'todo' ? `<span class="sd">${esc(st)}</span>` : ''}</div>
        <p>${s.do}</p>
        <p class="gget"><b>You get:</b> ${s.get}</p>
      </div>
      <button class="btn small ghost" data-act="tab" data-k="${s.k}">Open</button>
    </li>`;
  }).join('');
  const rules = [['Must invite: high impact, high want', 'Impact and want both 2.5 or more. Invited first while their side has seats. Higher impact goes first.'],
    ['Impact of 4 or 5, low want', 'Once every must invite has a seat, they get the remaining seats first. A 5 goes before a 4. If there are no seats left, they go on the waitlist.'],
    ['Other high impact or high want', 'Impact of 2.5 to under 4 with low want, or low impact with want of 2.5 or more. Invited if their side still has seats, highest total rating first. Otherwise they go on the waitlist.']];
  return `<section class="ghero">
    <span class="eyebrow">Start here</span>
    <h2>Two lists, one guest list.</h2>
    <p>You each answer on your own first, then agree together. The bounds lock when one of you confirms them, and the table and the final list need you both. The Download Excel button at the top of every page exports everything entered so far.</p>
    <div class="row wrap">
      ${me ? `<button class="btn primary" data-act="tab" data-k="${nextStep.k}">${stepState('hard') === 'todo' ? 'Start with step 1' : 'Continue: ' + nextStep.t.toLowerCase()}</button>`
        : `<button class="btn primary" data-act="tab" data-k="hard">Get started</button>`}
      ${mode !== 'demo' ? `<button class="btn" data-act="demo">See the example couple</button>` : ''}
    </div>
  </section>
  <div class="gbasics">
    <div class="gb"><span class="gbico solo" aria-hidden="true"></span><div><b>Solo steps</b><p>Do them on your own phone or laptop. Your partner sees your answers only after you have both submitted, so you don’t anchor on each other.</p></div></div>
    <div class="gb"><span class="gbico together" aria-hidden="true"></span><div><b>Together steps</b><p>Sit down side by side. A bound locks when one of you confirms it. The table and the final list need you both.</p></div></div>
    <div class="gb"><span class="gbico either" aria-hidden="true"></span><div><b>Either of you</b><p>Hard bounds are facts, like the budget and the venue. Either of you can enter them, and the other one checks them and confirms.</p></div></div>
  </div>
  <div class="gcols">
    <div class="card"><h3>The seven steps</h3><ol class="gsteps">${steps}</ol></div>
    <div class="side">
      <div class="card"><h3>How you rate each guest</h3>
        <div class="scale"><b>Want them there</b><div class="sbar"><span>0</span><i></i><span>5</span></div><div class="sends"><span>${ANCH.w[0]}</span><span>${ANCH.w[1]}</span></div></div>
        <div class="scale"><b>Impact if not invited</b><div class="sbar"><span>0</span><i></i><span>5</span></div><div class="sends"><span>${ANCH.i[0]}</span><span>${ANCH.i[1]}</span></div></div>
        <p class="small muted">You only rate the guests on your own list. A guest on both lists gets both ratings. If they differ by 2 or more, you choose together how to settle it.</p>
      </div>
      <div class="card"><h3>Who gets invited</h3>
        <ol class="rules">${rules.map(([d, t]) => `<li><b>${d}</b><p>${t}</p></li>`).join('')}</ol>
        <p class="small muted">A rating of 2.5 or more counts as high. Guests with both ratings under 2.5 are not invited. Each side keeps a share of seats for family and for others and fills it first. Seats a share does not use go to the next guests in line on that side. You can change any suggestion on the dashboard.</p>
      </div>
      <div class="card"><h3>Good to know</h3>
        <ul class="tips">
          <li>Set how many +1s each guest may bring (0 to 5). Every +1 takes a seat.</li>
          <li>Guests on both lists come out of a shared pool of seats. That pool is taken off the top before the two sides split the rest.</li>
          <li>The waitlist is ranked. When someone declines, the next guest in line on that side moves up to Invited by itself.</li>
          <li>The dashboard shows how many seats each of you still has left, for family and for others.</li>
          <li>Download Excel at the top exports everything: each partner’s answers, the alignment and the RSVP tracker.</li>
        </ul>
      </div>
    </div>
  </div>`;
}

/* ---------- who are you ---------- */

  const taken = ['p1', 'p2'].filter(p => S.partners[p]);
  const free = ['p1', 'p2'].find(p => !S.partners[p]);
  const cont = taken.map(p => `<button class="btn big ${p}" data-act="beMe" data-p="${p}">Continue as ${esc(P(p))}<small>${esc(ROLE(p))}</small></button>`).join('');
  const role = LS.get('draftRole') || '';
  return `<section class="who-card">
    <h2>Who are you?</h2>
    <p class="lead">You each answer some steps on your own and agree on others together. Open this same page on your own phone or laptop.</p>
    ${taken.length ? `<div class="cont">${cont}</div>` : ''}
    ${free ? `<form class="join" data-act-form="join">
      ${taken.length ? `<p class="small muted">New here? Join as ${esc(P(taken[0]))}’s partner.</p>` : ''}
      <label for="whoName">Your first name</label>
      <input id="whoName" type="text" autocomplete="given-name" maxlength="40" placeholder="e.g. Mia" value="${kept('whoName')}" data-keep="whoName">
      <span class="lbl" id="roleLbl">You are the</span>
      <div class="seg" role="radiogroup" aria-labelledby="roleLbl">${['Bride', 'Groom', 'Partner'].map(r => `<button type="button" class="${role === r ? 'on' : ''}" role="radio" aria-checked="${role === r}" data-act="pickRole" data-r="${r}">${r}</button>`).join('')}</div>
      <p class="hint">Pick what fits you. Two brides or two grooms works, and Partner is there if neither fits. This only changes the label next to your name.</p>
      <p class="slotnote"><span class="dot ${free}"></span>Your color on this page: ${free === 'p1' ? 'deep pink' : 'light pink'}</p>
      <button class="btn primary" type="submit">Enter</button>
    </form>` : ''}
    ${mode !== 'demo' ? `<p class="small muted">Want to see it first? <button class="link" data-act="demo">Explore the example couple</button></p>` : ''}
  </section>`;
}

/* ---------- step 1: hard bounds (either of you) ---------- */
function qLabel(q){ return q.label.replace('{p1}', esc(P('p1'))).replace('{p2}', esc(P('p2'))); }
function qHelp(q){ return q.help.replace('{p1}', esc(P('p1'))).replace('{p2}', esc(P('p2'))); }
function myVals(){ const a = S.answers[me]; return Object.assign({}, DEFAULTS, a && a.values ? a.values : {}); }
// A slider that starts at 1 and then moves in steps (1, 5, 10 ... or 1, 500, 1000 ...): position 0 is the value 1, position n is n times the step.
const snapPos = (v, q) => v <= 1 ? 0 : Math.round(v / q.step);
const snapVal = (pos, step) => +pos === 0 ? 1 : +pos * step;
const sliderVal = el => el.dataset.snap ? snapVal(el.value, +el.dataset.snap) : +el.value;
function sliderHtml(q, id, v, attrs, off){
  const sn = !!q.snap, min = sn ? 0 : q.min, max = sn ? Math.round(q.max / q.step) : q.max, step = sn ? 1 : q.step, val = sn ? snapPos(v, q) : v;
  return `<input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" ${sn ? `data-snap="${q.step}"` : ''} data-unit="${q.unit}" data-out="${id}-o" ${off ? 'disabled' : ''} ${attrs}>`;
}
function readHard(){
  const H = hardOf(S), out = {};
  HARDQ.forEach(q => { const el = document.getElementById('h-' + q.k); out[q.k] = el ? sliderVal(el) : H.values[q.k]; });
  return out;
}
const confChips = conf => ['p1', 'p2'].map(p => `<span class="cf ${conf && conf[p] ? 'yes' : ''}">${conf && conf[p] ? '✓ ' : ''}${esc(P(p))}</span>`).join('');
function hardBox(v){
  const L = hardLimits(v), mx = Math.max(L.fb, L.venue, 1);
  const rows = [['budget', 'Food and drinks budget allows', L.fb], ['venue', 'Venue holds', L.venue]];
  return `<span class="eyebrow">Hard maximum</span><div class="capnum">${nf.format(L.hi)}<small>guests at most</small></div>
    <div class="capbars">${rows.map(([k, l, n]) => `<div class="cb${L.hiBind === k ? ' bind' : ''}"><span>${l}</span><div class="track"><i style="width:${Math.max(4, n / mx * 100)}%"></i></div><b>${nf.format(n)}</b></div>`).join('')}</div>
    <p class="small muted">${L.hiBind === 'budget' ? `The budget is the limit: ${esc(fmtMoney(v.fbTotal))} at ${esc(fmtMoney(v.fbPP))} a guest pays for ${nf.format(L.fb)} guests.` : `The venue is the limit. The budget would pay for ${nf.format(L.fb)} guests.`}</p>`;
}
function viewHard(){
  const H = hardOf(S), v = H.values, oth = other(me);
  const cards = HARDQ.map(q => { const id = 'h-' + q.k;
    return `<div class="qcard"><div class="qtxt"><h3>${qLabel(q)}</h3><p>${qHelp(q)}</p></div>
      <div class="slide"><output id="${id}-o" class="big">${esc(fmtNum(v[q.k], q.unit))}</output>${sliderHtml(q, id, v[q.k], 'data-ch="hard" data-k="' + q.k + '" data-live="hard"')}
      <div class="ends">${endsHtml(q)}</div></div></div>`; }).join('');
  const curCard = `<div class="qcard"><div class="qtxt"><h3>Which currency are you planning in?</h3><p>You both see the same currency. Changing it asks you both to confirm the numbers again.</p></div>
    <div class="seg wide three">${CURS.map(c => `<button class="${currency() === c ? 'on' : ''}" data-act="setCur" data-v="${c}">${CUR_NAME[c]}</button>`).join('')}</div></div>`;
  let note;
  if (H.locked) note = 'Confirmed by both of you. You can still change a number, and then you both confirm again.';
  else if (H.conf[me] && !H.conf[oth]) note = `You confirmed these numbers. Waiting for ${P(oth)}.`;
  else if (!H.conf[me] && H.conf[oth]) note = `${P(oth)} confirmed these numbers. Check them, change what you need to, then confirm.`;
  else if (H.entered && H.by && H.by !== me) note = `${P(H.by)} has already entered these numbers. Check them, change what you need to, then confirm.`;
  else if (H.entered) note = `These numbers are saved, and ${P(oth)} can see them. Confirm when you are happy with them.`;
  else note = `Nobody has entered these yet. Either of you can fill them in, and the other one checks them. The sliders show starting points.`;
  return `<section class="intro"><div><h2>Hard bounds</h2><p>Facts about the money and the venue. Either of you can enter them. The other one sees them, can change them if needed, and then confirms.</p></div><span class="who either">Either of you</span></section>
  <div class="cols">
    <div class="qlist">${curCard}${cards}</div>
    <aside class="side sticky">
      <div class="card capcard" id="hardPreview">${hardBox(v)}</div>
      <div class="card">
        <div class="cfs">${confChips(H.conf)}</div>
        <p class="small ${H.entered && H.by && H.by !== me && !H.conf[me] ? '' : 'muted'}" id="hardNote">${esc(note)}</p>
        ${H.conf[me] ? `<button class="btn full" data-act="unconfirmHard">Undo my confirmation</button>` : `<button class="btn primary full" data-act="confirmHard">Confirm these numbers</button>`}
      </div>
    </aside>
  </div>`;
}

/* ---------- step 2: your personal bounds (solo) ---------- */
function hardSummary(c, linkText, compact){
  const items = [[fmtMoney(c.fbPP), 'Average food and drinks per guest'], [fmtMoney(c.fbTotal), 'Total food and drinks budget'], [nf.format(c.venueMax) + ' guests', 'The venue holds']];
  const head = `<span class="eyebrow">Hard bounds</span><span class="hs-state ${c.status.hard === 'locked' ? 'ok' : ''}">${c.status.hard === 'locked' ? '✓ Confirmed by both' : 'Not confirmed by both yet'}</span>`;
  const foot = `<p class="small hs-max">Hard maximum: <b>${nf.format(c.hi)} guests</b>, set by ${c.hiBind === 'budget' ? 'the food and drinks budget' : 'the venue'}.</p><div class="cfs">${confChips(c.hardConf)}</div>`;
  if (compact) return `<div class="card hardsum compact"><div class="hs-head">${head}</div>
    <dl class="hs-list">${items.map(([v, l]) => `<div><dt>${l}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>${foot}
    <button class="btn small ghost full" data-act="tab" data-k="hard">${linkText}</button></div>`;
  return `<div class="card hardsum"><div class="tabletop"><div class="hs-head">${head}</div><button class="btn small ghost" data-act="tab" data-k="hard">${linkText}</button></div>
    <div class="hs-grid">${items.map(([v, l]) => `<div><b>${esc(v)}</b><span>${l}</span></div>`).join('')}</div>${foot}</div>`;
}
function viewBounds(){
  const a = S.answers[me] || {}, done = !!a.submitted, v = myVals(), c = constraintsOf(S);
  const cards = QUESTIONS.map(q => {
    const id = 'b-' + q.k;
    return `<div class="qcard"><div class="qtxt"><h3>${qLabel(q)}</h3><p>${qHelp(q)}</p></div>
      <div class="slide"><output id="${id}-o" class="big${longCls(q)}">${esc(fmtNum(v[q.k], q.unit))}</output>
      <input type="range" id="${id}" min="${q.min}" max="${q.max}" step="${q.step}" value="${v[q.k]}" ${done ? 'disabled' : ''} data-ch="ans" data-k="${q.k}" data-unit="${q.unit}" data-out="${id}-o">
      <div class="ends">${endsHtml(q)}</div></div></div>`;
  }).join('');
  const oth = other(me);
  return `<section class="intro"><div><h2>Your bounds</h2><p>These are personal, so answer on your own. ${esc(P(oth))} sees your answers only after you have both submitted. You align them together in the next step.</p></div><span class="who solo">Solo</span></section>
  <div class="cols">
    <div class="qlist">${cards}</div>
    <aside class="side sticky">
      ${hardSummary(c, 'See or change', true)}
      <div class="card">
        ${done ? `<p class="ok">✓ Submitted</p><p class="small muted">${ansIn(oth) ? esc(P(oth)) + ' has submitted too. Go to Align bounds.' : 'Waiting for ' + esc(P(oth)) + ' to submit.'}</p>
          <div class="row"><button class="btn" data-act="editAns">Edit my answers</button>${ansIn(oth) ? `<button class="btn primary" data-act="tab" data-k="agree">Align bounds</button>` : ''}</div>`
        : `<p class="small muted">You can change your answers until you submit.</p><button class="btn primary full" data-act="submitAns">Submit my answers</button>`}
      </div>
    </aside>
  </div>`;
}

/* ---------- step 3: align the bounds (together) ---------- */
function finalHelp(c){
  const lim = c.hiBind === 'budget' ? `the food and drinks budget (${fmtMoney(c.fbTotal)} at ${fmtMoney(c.fbPP)} a guest)` : `the venue (${nf.format(c.venueMax)} guests)`;
  const open = c.status.hard === 'locked' ? '' : ' The hard bounds are not confirmed by both of you yet, so this range can still change.';
  if (c.lo === c.hi) return `The most you can have is ${nf.format(c.hi)} guests, set by ${lim}, and both of you are fine with at least that many. So there is nothing to choose.` + open;
  return `Choose a number from ${nf.format(c.lo)} to ${nf.format(c.hi)}. ${nf.format(c.lo)} is the lower of your two “stops feeling like our wedding” answers. ${nf.format(c.hi)} is the most you can have, set by ${lim}.` + open;
}
function capBox(c, title){
  const rows = [['budget', 'Food and drinks budget allows', c.fbCap], ['venue', 'Venue holds', c.venueMax], ['feel', 'Lowest “stops feeling like our wedding”', c.feelMax]];
  const mx = Math.max(c.fbCap, c.venueMax, c.feelMax, 1);
  const hot = k => (k === c.hiBind) || (k === 'feel' && c.loBind === 'feel');
  const note = c.lo === c.hi ? `Only ${nf.format(c.hi)} is possible.` : `Anything from ${nf.format(c.lo)} to ${nf.format(c.hi)}. Above ${nf.format(c.lo)} means going past the lowest “stops feeling like our wedding” answer.`;
  return `<span class="eyebrow">${title}</span><div class="capnum">${nf.format(c.cap)}<small>guests in total</small></div>
    <div class="capbars">${rows.map(([k, l, n]) => `<div class="cb${hot(k) ? ' bind' : ''}"><span>${l}</span><div class="track"><i style="width:${Math.max(4, n / mx * 100)}%"></i></div><b>${nf.format(n)}</b></div>`).join('')}</div>
